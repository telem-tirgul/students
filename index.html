<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>תלם שלי</title>
<meta name="theme-color" content="#5A1216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="תלם שלי">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800;900&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F3EF; --paper:#FFFFFF; --ink:#2B2320; --ink-soft:#6B5F55; --border:#E5DDD3;
    --accent:#5A1216; --accent-ink:#FFFFFF; --accent-soft:#F3E3E4; --gold:#C9A45C; --muted:#F1ECE6;
    --ok:#3F7D4F; --ok-bg:#E5F1E8; --warn:#B7791F; --warn-bg:#FBF0DC; --bad:#B3423F;
    --font-display:'Heebo','Segoe UI',sans-serif; --font-body:'Assistant','Segoe UI',sans-serif;
    --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17110F; --paper:#231B18; --ink:#F3ECE6; --ink-soft:#BBA99B; --border:#3E322C;
      --accent:#E2707A; --accent-ink:#1A0F0E; --accent-soft:#3A1D20; --gold:#E3B765; --muted:#2E2420;
      --ok:#6CC082; --ok-bg:#1D3324; --warn:#E3B765; --warn-bg:#3A2C14; --bad:#FF8A80;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17110F; --paper:#231B18; --ink:#F3ECE6; --ink-soft:#BBA99B; --border:#3E322C;
    --accent:#E2707A; --accent-ink:#1A0F0E; --accent-soft:#3A1D20; --gold:#E3B765; --muted:#2E2420;
    --ok:#6CC082; --ok-bg:#1D3324; --warn:#E3B765; --warn-bg:#3A2C14; --bad:#FF8A80;
    color-scheme: dark;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; min-height:100%; }
  body{ background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.5; }
  button,input,select,textarea{ font:inherit; color:inherit; }
  h1,h2,h3{ font-family:var(--font-display); margin:0; text-wrap:balance; }
  [hidden]{ display:none !important; }
  .wrap{ max-width:560px; margin:0 auto; padding:0 16px; }
  .wrap.wide{ max-width:980px; }

  /* top bar */
  .top{ position:sticky; top:0; z-index:30; background:var(--accent); color:#fff; padding-top:var(--safe-t); }
  :root[data-theme="dark"] .top{ background:#3A1416; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .top{ background:#3A1416; } }
  .top .row{ display:flex; align-items:center; gap:10px; min-height:58px; }
  .top img{ height:34px; background:#fff; border-radius:8px; padding:2px 5px; }
  .top .ttl{ font-family:var(--font-display); font-weight:800; font-size:18px; line-height:1.2; flex:1; min-width:0; }
  .top .ttl small{ display:block; font-weight:500; font-size:12.5px; opacity:.8; }
  .icon-btn{ background:none; border:none; color:inherit; width:44px; height:44px; border-radius:12px; display:grid; place-items:center; cursor:pointer; flex:none; }
  .icon-btn:active{ background:rgba(255,255,255,.15); }
  .icon-btn svg{ width:24px; height:24px; }
  .tabs{ display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; }
  .tabs button{ background:none; border:none; color:rgba(255,255,255,.75); padding:10px 14px; font-weight:700; font-family:var(--font-display);
                border-bottom:3px solid transparent; cursor:pointer; white-space:nowrap; }
  .tabs button.on{ color:#fff; border-bottom-color:var(--gold); }
  .badge{ display:inline-block; min-width:20px; padding:0 6px; border-radius:10px; background:var(--gold); color:#2B2320; font-size:12px; font-weight:800; text-align:center; margin-inline-start:4px; line-height:20px; }

  /* basic blocks */
  main{ padding:16px 0 calc(110px + var(--safe-b)); }
  .card{ background:var(--paper); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:12px; }
  .muted{ color:var(--ink-soft); }
  .small{ font-size:14px; }
  .sec-h{ font-family:var(--font-display); font-weight:800; font-size:15px; color:var(--ink-soft); margin:20px 2px 8px; display:flex; align-items:center; gap:8px; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:0 18px; border-radius:14px;
        border:1px solid var(--border); background:var(--paper); font-weight:700; font-family:var(--font-display); cursor:pointer; text-decoration:none; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.ok{ background:var(--ok); border-color:var(--ok); color:#fff; }
  .btn.ghost{ background:none; }
  .btn.sm{ min-height:38px; padding:0 12px; border-radius:11px; font-size:14px; }
  .btn.block{ width:100%; }
  .btn:disabled{ opacity:.5; cursor:default; }
  .btn svg{ width:20px; height:20px; }
  .field{ display:block; margin-bottom:14px; }
  .field span{ display:block; font-weight:700; margin-bottom:6px; font-size:15px; }
  .field input, .field select{ width:100%; min-height:52px; border:1px solid var(--border); border-radius:14px; background:var(--paper); padding:0 14px; font-size:18px; }
  .field input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .code-input{ letter-spacing:.35em; text-align:center; direction:ltr; font-family:var(--font-display) !important; font-weight:800; }
  .ltr{ direction:ltr; unicode-bidi:embed; }
  .err{ color:var(--bad); font-weight:700; min-height:1.5em; }
  .chip{ display:inline-flex; align-items:center; gap:4px; padding:2px 10px; border-radius:20px; font-size:13px; font-weight:700; background:var(--muted); color:var(--ink-soft); }
  .chip.new{ background:var(--gold); color:#2B2320; }
  .chip.ok{ background:var(--ok-bg); color:var(--ok); }
  .chip.warn{ background:var(--warn-bg); color:var(--warn); }
  .chip.acc{ background:var(--accent-soft); color:var(--accent); }
  .toast{ position:fixed; inset-inline:16px; bottom:calc(20px + var(--safe-b)); margin:0 auto; max-width:480px; background:#2B2320; color:#fff; border-radius:14px; padding:14px 16px; font-weight:700; z-index:100; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.25); }
  .empty{ text-align:center; padding:36px 16px; }
  .empty svg{ width:56px; height:56px; color:var(--gold); }

  /* login */
  .login{ min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:24px 0 calc(24px + var(--safe-b)); }
  .login .logo{ display:block; height:84px; margin:0 auto 14px; background:#fff; border-radius:16px; padding:6px 10px; }
  .login h1{ text-align:center; font-size:26px; margin-bottom:4px; }
  .login p.lead{ text-align:center; margin:0 0 22px; }
  .linkish{ background:none; border:none; color:var(--accent); font-weight:700; cursor:pointer; padding:10px; text-decoration:underline; }

  /* student pages */
  .seg{ display:flex; background:var(--muted); border-radius:14px; padding:4px; gap:4px; margin-bottom:6px; }
  .seg button{ flex:1; border:none; background:none; min-height:44px; border-radius:11px; font-weight:800; font-family:var(--font-display); cursor:pointer; color:var(--ink-soft); }
  .seg button.on{ background:var(--paper); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .page-card{ display:flex; gap:14px; align-items:center; width:100%; text-align:start; background:var(--paper); border:1px solid var(--border);
              border-radius:16px; padding:10px; margin-bottom:10px; cursor:pointer; }
  .page-card.is-new{ border-color:var(--gold); box-shadow:0 0 0 2px color-mix(in srgb, var(--gold) 35%, transparent); }
  .thumb{ display:block; width:76px; aspect-ratio:210/297; border-radius:8px; background:var(--muted) center/cover no-repeat; flex:none; border:1px solid var(--border); }
  .page-card .t{ font-family:var(--font-display); font-weight:800; font-size:17px; line-height:1.3; }
  .page-card .s{ font-size:14px; color:var(--ink-soft); margin-top:2px; }
  .page-card .go{ margin-inline-start:auto; color:var(--ink-soft); flex:none; }
  .done-row{ display:flex; align-items:center; gap:10px; padding:12px 4px; border-bottom:1px solid var(--border); cursor:pointer; background:none; border-inline:none; border-top:none; width:100%; text-align:start; }
  .done-row svg{ width:22px; height:22px; color:var(--ok); flex:none; }
  details.dt{ padding:0; margin:0 0 10px; overflow:hidden; }
  details.dt > summary{ list-style:none; display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; min-height:56px; }
  details.dt > summary::-webkit-details-marker{ display:none; }
  .dt-no{ flex:none; min-width:32px; height:32px; padding:0 6px; border-radius:10px; background:var(--accent-soft); color:var(--accent); font-family:var(--font-display); font-weight:800; display:grid; place-items:center; font-size:15px; }
  .dt-name{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .dt-name b{ font-family:var(--font-display); font-weight:700; font-size:16px; line-height:1.3; }
  .dt-name small{ color:var(--ink-soft); font-size:13px; }
  .dt-car{ flex:none; font-style:normal; color:var(--ink-soft); font-size:14px; }
  .dt-car::after{ content:"◂"; }
  details.dt[open] .dt-car::after{ content:"▾"; }
  .dt-body{ padding:0 14px 6px; border-top:1px solid var(--border); }
  .dt-body .done-row:last-child{ border-bottom:none; }
  .dt-sub{ font-size:13px; font-weight:700; color:var(--ink-soft); padding:12px 2px 2px; }
  .dt-book{ font-family:var(--font-display); font-weight:700; font-size:13px; color:var(--ink-soft); margin:14px 4px 6px; }

  /* viewer */
  .viewer{ position:fixed; inset:0; z-index:60; background:#111; display:flex; flex-direction:column; overscroll-behavior:contain; }
  /* דף פתוח: כל המסך כהה (גם מאחורי פס הכתובת / אזור הבית בטלפון) והעמוד מאחור לא זז – בלי פס לבן למטה (1.12.1) */
  html.vw-open, html.vw-open body{ background:#111 !important; background-image:none !important; overflow:hidden; overscroll-behavior:none; }
  html.vw-open body{ position:fixed; inset-inline:0; width:100%; }
  .viewer .vtop{ display:flex; align-items:center; gap:6px; padding:calc(6px + var(--safe-t)) 8px 6px; color:#fff; background:#111; }
  .viewer .vtop .ttl{ flex:1; font-family:var(--font-display); font-weight:800; font-size:16px; line-height:1.25; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .viewer .stage{ flex:1; overflow:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; background:#2a2a2a; touch-action:pan-x pan-y pinch-zoom; }
  .viewer .stage{ display:flex; }
  /* הדף ממורכז גם לגובה כשהוא קצר מהמסך (1.12.2); margin:auto – כשמגדילים אין חלק שנחתך */
  .viewer .stage img{ display:block; flex:none; width:100%; height:auto; margin:auto; background:#fff; transition:width .15s; }
  .viewer .vbar{ display:flex; gap:10px; padding:10px 12px calc(10px + var(--safe-b)); background:#111; }
  .viewer .vbar .btn{ flex:1; }
  .viewer .vbar .btn.ghost{ color:#fff; border-color:#555; }
  .zoom{ display:flex; gap:2px; }

  /* sheet */
  .sheet-bg{ position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; }
  .sheet{ background:var(--paper); width:100%; max-width:560px; max-height:92vh; overflow:auto; border-radius:22px 22px 0 0; padding:18px 18px calc(20px + var(--safe-b)); }
  @media (min-width:700px){ .sheet-bg{ align-items:center; } .sheet{ border-radius:22px; } }
  .sheet h2{ font-size:21px; margin-bottom:10px; }
  .steps{ margin:0; padding:0; list-style:none; counter-reset:s; }
  .steps li{ counter-increment:s; display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--border); }
  .steps li::before{ content:counter(s); flex:none; width:30px; height:30px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-weight:800; font-family:var(--font-display); }
  .kbd{ display:inline-flex; align-items:center; gap:4px; background:var(--muted); border:1px solid var(--border); border-radius:8px; padding:0 6px; font-weight:700; white-space:nowrap; }
  .kbd svg{ width:16px; height:16px; }
  .install-banner{ display:flex; gap:12px; align-items:center; background:var(--accent-soft); border:1px solid color-mix(in srgb, var(--accent) 25%, transparent); }
  .install-banner svg{ width:30px; height:30px; color:var(--accent); flex:none; }
  .install-banner .x{ margin-inline-start:auto; }

  /* manager */
  .search{ width:100%; min-height:48px; border:1px solid var(--border); border-radius:14px; padding:0 14px; background:var(--paper); font-size:16px; margin-bottom:10px; }
  .filters{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .filters button{ border:1px solid var(--border); background:var(--paper); border-radius:20px; padding:6px 12px; font-weight:700; cursor:pointer; font-size:14px; }
  .filters button.on{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .st-row{ display:flex; align-items:center; gap:10px; width:100%; text-align:start; background:var(--paper); border:1px solid var(--border); border-radius:14px; padding:12px 14px; margin-bottom:8px; cursor:pointer; }
  .st-row .n{ font-family:var(--font-display); font-weight:800; font-size:16px; }
  .st-row .meta{ font-size:13.5px; color:var(--ink-soft); }
  .st-row .chips{ display:flex; gap:4px; flex-wrap:wrap; margin-inline-start:auto; justify-content:flex-end; }
  .wait-card .head{ display:flex; gap:10px; align-items:flex-start; }
  .wait-card .head .n{ font-family:var(--font-display); font-weight:800; font-size:17px; }
  .wait-card .next{ margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .grid2{ display:grid; grid-template-columns:1fr; gap:12px; }
  @media (min-width:860px){ .grid2{ grid-template-columns:1fr 1fr; } }
  .plan-item{ display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); }
  .plan-item:last-child{ border-bottom:none; }
  .plan-item .thumb{ width:44px; border-radius:5px; cursor:zoom-in; }
  @media (max-width:480px){ .plan-item .thumb{ display:none; } }
  .plan-item .t{ flex:1; min-width:0; font-weight:700; line-height:1.3; }
  .plan-item .t small{ display:block; font-weight:400; color:var(--ink-soft); font-size:13px; }
  .plan-item .pos{ width:26px; text-align:center; font-weight:800; color:var(--ink-soft); font-family:var(--font-display); }
  .mini{ background:none; border:1px solid var(--border); border-radius:9px; width:34px; height:34px; display:grid; place-items:center; cursor:pointer; flex:none; color:var(--ink-soft); }
  .mini svg{ width:18px; height:18px; }
  .mini:disabled{ opacity:.3; }
  .plan-item input[type=checkbox]{ width:22px; height:22px; accent-color:var(--accent); flex:none; }
  .acc-box{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .books{ display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:8px; }
  .books button{ flex:none; border:1px solid var(--border); background:var(--paper); border-radius:12px; padding:8px 12px; font-weight:800; cursor:pointer; font-family:var(--font-display); font-size:14px; }
  .books button.on{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .topic-row{ display:flex; gap:10px; align-items:center; width:100%; text-align:start; padding:12px 14px; background:var(--paper); border:1px solid var(--border); border-radius:12px; margin-bottom:6px; cursor:pointer; }
  .topic-row .no{ font-family:var(--font-display); font-weight:900; color:var(--accent); width:28px; flex:none; }
  .topic-row .nm{ flex:1; font-weight:700; }
  .ws-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:10px; }
  .ws-tile{ position:relative; background:var(--paper); border:2px solid var(--border); border-radius:12px; padding:6px; cursor:pointer; text-align:start; }
  .ws-tile .thumb{ width:100%; }
  .ws-tile .cap{ font-size:13px; font-weight:700; line-height:1.25; margin-top:5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .ws-tile.sel{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent); }
  .ws-tile .tick{ position:absolute; top:10px; inset-inline-start:10px; width:28px; height:28px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:none; place-items:center; }
  .ws-tile.sel .tick{ display:grid; }
  .ws-tile .inplan{ position:absolute; top:10px; inset-inline-end:10px; }
  .ws-tile.dim{ opacity:.55; }
  .actionbar{ position:fixed; inset-inline:0; bottom:0; z-index:40; background:var(--paper); border-top:1px solid var(--border); padding:10px 16px calc(10px + var(--safe-b)); box-shadow:0 -6px 18px rgba(0,0,0,.08); }
  .actionbar .inner{ max-width:980px; margin:0 auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .actionbar .inner .sp{ flex:1; font-weight:700; }
  .crumb{ display:flex; align-items:center; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .pick-banner svg{ width:22px; height:22px; flex:none; }
  .pick-banner{ background:var(--accent-soft); border:1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius:14px; padding:10px 14px; margin-bottom:12px; display:flex; gap:10px; align-items:center; font-weight:700; }
  pre.msg{ unicode-bidi:plaintext; white-space:pre-wrap; background:var(--muted); border-radius:12px; padding:12px; font-family:var(--font-body); font-size:15px; margin:10px 0; }

  /* ===================== ניהול – גרסה 1.1 ===================== */
  #adminView{ --side-w:248px; --bg2:#EFEAE4; }
  :root[data-theme="dark"] #adminView{ --bg2:#120D0B; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) #adminView{ --bg2:#120D0B; } }
  .ad-shell{ min-height:100vh; }
  .ad-side{ display:none; }
  .ad-top{ position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:10px; padding:calc(8px + var(--safe-t)) 12px 8px;
           background:var(--accent); color:#fff; }
  :root[data-theme="dark"] .ad-top{ background:#3A1416; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .ad-top{ background:#3A1416; } }
  .ad-top img{ height:32px; background:#fff; border-radius:8px; padding:2px 5px; }
  .ad-top .ttl{ flex:1; font-family:var(--font-display); font-weight:800; font-size:18px; }
  .ad-main{ padding:14px 14px calc(96px + var(--safe-b)); max-width:760px; margin:0 auto; }
  .ad-bottom{ position:fixed; inset-inline:0; bottom:0; z-index:35; display:flex; background:var(--paper); border-top:1px solid var(--border);
              padding:4px 6px calc(4px + var(--safe-b)); box-shadow:0 -4px 16px rgba(0,0,0,.06); }
  .ad-bottom button{ flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px;
                     font-weight:700; font-size:12.5px; color:var(--ink-soft); cursor:pointer; position:relative; font-family:var(--font-display); }
  .ad-bottom button svg{ width:24px; height:24px; }
  .ad-bottom button.on{ color:var(--accent); }
  .ad-bottom .badge{ position:absolute; top:2px; inset-inline-start:calc(50% + 6px); margin:0; }
  .icon-btn.dark{ color:var(--ink); }
  .icon-btn.dark:active{ background:var(--muted); }

  /* מחשב */
  @media (min-width:900px){
    #adminView .ad-shell{ display:grid; grid-template-columns:var(--side-w) 1fr; background:var(--bg); }
    .ad-top, .ad-bottom{ display:none; }
    .ad-side{ display:flex; flex-direction:column; position:sticky; top:0; height:100vh; background:#2E2220; color:#E9DED6; padding:20px 14px; gap:6px; }
    .ad-brand{ display:flex; align-items:center; gap:10px; padding:0 6px 18px; border-bottom:1px solid rgba(255,255,255,.1); margin-bottom:10px; }
    .ad-brand img{ height:40px; background:#fff; border-radius:9px; padding:2px 6px; }
    .ad-brand b{ font-family:var(--font-display); font-size:19px; font-weight:900; display:block; line-height:1.15; }
    .ad-brand small{ opacity:.65; font-size:13px; }
    .ad-nav{ display:flex; flex-direction:column; gap:2px; }
    .ad-nav button{ display:flex; align-items:center; gap:12px; width:100%; background:none; border:none; color:inherit; padding:11px 12px; border-radius:12px;
                    font-weight:700; font-family:var(--font-display); font-size:15.5px; cursor:pointer; text-align:start; }

const AUTH_KEY = "telem_portal_auth";
let auth = null;
try { auth = JSON.parse(store(AUTH_KEY) || "null"); } catch(e) {}
function saveAuth(a){ auth = a; store(AUTH_KEY, a ? JSON.stringify(a) : null); }
function baseHeaders(){
  const h = { "apikey": CONFIG.anonKey, "Content-Type": "application/json" };
  if (CONFIG.anonKey.indexOf("eyJ") === 0) h["Authorization"] = "Bearer " + CONFIG.anonKey;
  return h;
}
async function tokenRequest(grant, body){
  const res = await fetch(CONFIG.supabaseUrl + "/auth/v1/token?grant_type=" + grant, { method:"POST", headers: baseHeaders(), body: JSON.stringify(body) });
  const data = await res.json().catch(() => null);
  if (!res.ok || !data || !data.access_token) { const e = new Error("auth failed"); e.status = res.status; e.data = data; throw e; }
  saveAuth({ access_token: data.access_token, refresh_token: data.refresh_token,
             expires_at: data.expires_at || (Math.floor(Date.now()/1000) + (data.expires_in || 3600)),
             email: (data.user && data.user.email) || (auth && auth.email) || "" });
}
let REFRESHING = null;
function refreshAuth(){
  if (REFRESHING) return REFRESHING;
  REFRESHING = (async () => {
    if (!auth) return false;
    const old = auth.refresh_token;
    for (let i = 0; i < 3; i++) {
      try { await tokenRequest("refresh_token", { refresh_token: old }); return true; }
      catch(e) {
        if (e.status === 400 || e.status === 401 || e.status === 403) { saveAuth(null); return false; }
        await new Promise(r => setTimeout(r, 1500 * (i + 1)));
      }
    }
    return !!auth && auth.expires_at > Date.now()/1000;
  })().finally(() => { REFRESHING = null; });
  return REFRESHING;
}
async function token(){
  if (!auth) return null;
  if (auth.expires_at - 60 > Date.now()/1000) return auth.access_token;
  return (await refreshAuth()) && auth ? auth.access_token : null;
}
async function api(method, path, body, extra){
  const t = await token();
  if (!t) { showLogin(); throw new Error("not signed in"); }
  const res = await fetch(CONFIG.supabaseUrl + path, { method, headers: Object.assign(baseHeaders(), { "Authorization": "Bearer " + t }, extra || {}),
                                                       body: body === undefined ? undefined : JSON.stringify(body) });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    const err = new Error(e.message || e.msg || ("HTTP " + res.status)); err.status = res.status; err.code = e.code; throw err;
  }
  if (res.status === 204) return null;
  const txt = await res.text(); return txt ? JSON.parse(txt) : null;
}
const get = (table, q) => api("GET", "/rest/v1/" + table + "?" + q);
async function getAll(table, q){
  const out = [], step = 1000;
  for (let off = 0; ; off += step) { const part = await get(table, q + "&limit=" + step + "&offset=" + off); out.push(...part); if (part.length < step) return out; }
}

const insert = (table, v) => api("POST", "/rest/v1/" + table, v, { "Prefer": "return=representation" });

const errText = (e) => { const m = String(e && e.message || ""); return /[֐-׿]/.test(m) ? m : "משהו השתבש. כדאי לנסות שוב."; };

// קישורים זמניים לתמונות (שעה)
const URLS = {};
async function sign(paths){
  const now = Date.now(), need = [...new Set(paths.filter(p => p && (!URLS[p] || URLS[p].exp < now + 120000)))];
  for (let i = 0; i < need.length; i += 100) {
    const part = need.slice(i, i + 100);
    try {
      const res = await api("POST", "/storage/v1/object/sign/worksheets", { expiresIn: 3600, paths: part });
      (res || []).forEach(r => { if (r.signedURL) URLS[r.path] = { url: CONFIG.supabaseUrl + "/storage/v1" + r.signedURL, exp: now + 3600 * 1000 }; });
    } catch(e) {}
  }
  return (p) => URLS[p] ? URLS[p].url + (WS_VER[p] ? "&v=" + WS_VER[p] : "") : "";
}

async function boot(){
  if (!(await token())) { showLogin(); return; }
  let isManager = false;
  try { isManager = !!(await rpc("portal_is_manager")); }
  catch(e) {
    if (e.status === 404 || e.code === "PGRST202") { showMsg("עוד לא מוכן", "צריך להריץ את קובץ 72.1 ב-Supabase."); return; }
    if (e.message === "not signed in") return;
    showMsg("אין חיבור", "לא הצלחנו להתחבר. כדאי לבדוק את האינטרנט ולנסות שוב."); return;
  }
  if (isManager) { adminStart(); return; }
  let me;
  try { me = await rpc("portal_me"); } catch(e) { showMsg("אין חיבור", "לא הצלחנו להתחבר. כדאי לנסות שוב."); return; }
  if (!me || me.status === "no_account") { showMsg("אין גישה", "המשתמש הזה לא מוגדר כתלמיד/ה. אם זו טעות – לכתוב לנו."); return; }
  if (me.status === "inactive") { showMsg("החשבון לא פעיל כרגע", "הגישה לדפים פתוחה רק לתלמידים רשומים. לשאלות – לכתוב לנו בוואטסאפ."); return; }
  ST.me = me;
  if (me.must_change_code) { showCodeChange(); return; }
  studentStart();
}

// "סיימתי" לפי סדר ההגעה (ברירת המחדל): האחרון שהגיע למעלה, מחולק לשבועות
function doneByOrder(done, kick){
  const rows = done.slice().sort((a, b) => String(b.released_at || "").localeCompare(String(a.released_at || "")) || String(b.done_at || "").localeCompare(String(a.done_at || "")) || b.item_id - a.item_id);
  const wk0 = new Date(); wk0.setHours(0, 0, 0, 0); wk0.setDate(wk0.getDate() - wk0.getDay());   // ראשון של השבוע
  const wkOf = (iso) => { if (!iso) return 99; const d = new Date(iso); return Math.max(0, Math.floor((wk0 - d) / 864e5 / 7) + 1); };
  const lbl = (w, iso) => { if (w === 0) return "השבוע"; if (w === 1) return "שבוע שעבר"; if (w === 99) return "מוקדם יותר";
    const d = new Date(iso); d.setDate(d.getDate() - d.getDay()); return "השבוע של " + fmtDay(d.toISOString()); };
  let h = "", last = null;
  rows.forEach(p => {
    const w = wkOf(p.released_at);
    if (w !== last) { h += `<div class="wk-h">${esc(lbl(w, p.released_at))}</div>`; last = w; }
    const k = kick(p);
    h += `<button class="dr" data-i="${p.item_id}"><span class="mi" style="background-image:url('${esc(ST.url(p.storage_path))}')"></span>
      <span class="nm">${k ? `<span class="kick">${esc(k)}</span>` : ""}<b>${esc(p.title)}</b></span>
      <span class="dd"><i>✓</i>${esc(fmtDay(p.done_at))}</span></button>`;
  });
  return h;
}
// "סיימתי" מסודר כמו במאגר: ספר → נושא → תת-נושא, ובתוכם לפי סדר הדפים
function doneByTopic(done){
  const num = (x) => { const n = parseFloat(x); return isNaN(n) ? 1e9 : n; };
  const kOrd = (k) => { const i = ["topic", "summary", "grammar", "unseen", "vocab", "general"].indexOf(k); return i < 0 ? 9 : i; };
  const rows = done.slice().sort((a, b) =>
    bookRank(a.book || "") - bookRank(b.book || "") || String(a.book || "").localeCompare(String(b.book || "")) ||
    kOrd(a.kind) - kOrd(b.kind) || num(a.topic_no) - num(b.topic_no) || String(a.topic_name || "").localeCompare(String(b.topic_name || "")) ||
    num(a.sort_order) - num(b.sort_order) || num(a.page_no) - num(b.page_no) || String(a.title || "").localeCompare(String(b.title || "")));
  const topics = [];
  rows.forEach(p => {
    const k = [p.book || "", p.kind || "", p.topic_no || "", p.topic_no ? "" : (p.topic_name || "")].join("|");
    let t = topics[topics.length - 1];
    if (!t || t.k !== k) { t = { k, p, rows: [], last: "" }; topics.push(t); }
    t.rows.push(p); if (String(p.done_at || "") > t.last) t.last = String(p.done_at || "");
  });
  if (!ST.openT) { ST.openT = new Set(); const latest = topics.slice().sort((a, b) => b.last.localeCompare(a.last))[0]; if (latest) ST.openT.add(latest.k); }
  const books = new Set(topics.map(t => t.p.book || "")), kinds = new Set(topics.map(t => t.p.kind || ""));
  const row = (p) => `<button class="done-row" data-i="${p.item_id}">${IC.circleCheck}<span style="flex:1;min-width:0"><b>${esc(p.title)}</b></span><span class="small muted">${esc(fmtDay(p.done_at))}</span></button>`;
  let h = "", lastBook = null;
  topics.forEach(t => {
    const p = t.p;
    if (books.size > 1 && p.book !== lastBook) { h += `<div class="dt-book">${esc(p.book_label || p.book || "")}</div>`; lastBook = p.book; }
    const no = p.topic_no ? String(Number(p.topic_no) || p.topic_no) : "";
    const meta = [kinds.size > 1 && p.kind ? (WS_KIND[p.kind] || "") : "", t.rows.length === 1 ? "דף אחד" : t.rows.length + " דפים"].filter(Boolean).join(" · ");
    // תתי-נושאים: לפי הסדר במאגר, כותרת רק כשיש
    const subs = []; t.rows.forEach(r => { const s = r.sub || ""; if (!subs.length || subs[subs.length - 1].s !== s) subs.push({ s, rows: [] }); subs[subs.length - 1].rows.push(r); });
    const inner = subs.some(x => x.s) ? subs.map(x => (x.s ? `<div class="dt-sub">${esc(x.s)}</div>` : "") + x.rows.map(row).join("")).join("") : t.rows.map(row).join("");
    h += `<details class="dt card" data-k="${esc(t.k)}" ${ST.openT.has(t.k) ? "open" : ""}><summary>${no ? `<span class="dt-no">${esc(no)}</span>` : ""}<span class="dt-name"><b>${esc(p.topic_name || "בלי נושא")}</b><small>${esc(meta)}</small></span><i class="dt-car" aria-hidden="true"></i></summary><div class="dt-body">${inner}</div></details>`;
  });
  return h;
}

async function fetchBlob(url){ const r = await fetch(url); if (!r.ok) throw new Error("fetch"); return r.blob(); }
async function saveImage(url, title){
  try {
    const blob = await fetchBlob(url);
    const name = (String(title || "page").replace(/[\\/:*?"<>|]/g, "").trim() || "page") + ".png";
    const file = new File([blob], name, { type: blob.type || "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  } catch(e) { if (e && e.name === "AbortError") return; toast("לא הצלחנו לשמור. אפשר ללחוץ לחיצה ארוכה על הדף ולבחור 'שמירה'."); }
}
async function copyImage(url){
  try {
    if (!window.ClipboardItem || !navigator.clipboard || !navigator.clipboard.write) throw new Error("no");
    await navigator.clipboard.write([new ClipboardItem({ "image/png": fetchBlob(url).then(b => b.type === "image/png" ? b : toPng(b)) })]);
    toast("הדף הועתק – אפשר להדביק בוואטסאפ.");
  } catch(e) { toast("ההעתקה לא עבדה בדפדפן הזה. אפשר ללחוץ לחיצה ארוכה על התמונה."); }
}
async function toPng(blob){
  const bmp = await createImageBitmap(blob); const c = document.createElement("canvas"); c.width = bmp.width; c.height = bmp.height;
  c.getContext("2d").drawImage(bmp, 0, 0); return new Promise(r => c.toBlob(r, "image/png"));
}

function waitingList(){
  const out = [];
  AD.students.forEach(s => (s.waiting_subjects || []).forEach(subj => {
    const last = planOf(s.student_id, subj).filter(p => p.done_at).sort((a, b) => b.done_at.localeCompare(a.done_at))[0];
    out.push({ s, subj, done_at: last ? last.done_at : s.last_done_at, last });
  }));
  return out.sort((a, b) => String(a.done_at || "").localeCompare(String(b.done_at || "")));   // הכי מזמן – ראשון
}

// ---------- ממתינים לפי קבוצות: עיר → מקום תרגול → יום ושעה ----------
const DAY_L = ["א", "ב", "ג", "ד", "ה", "ו", "ש"];
const todayIso = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
async function presentAllToday(){
  const iso = todayIso();
  if (AD.present && AD.present.iso === iso && Date.now() - AD.present.at < 5 * 60e3) return AD.present;
  let rows = null;
  try { rows = await get("attendance", "select=student_id,session_id&present=is.true&lesson_date=eq." + iso); } catch(e) {}
  AD.present = { iso, at: Date.now(), ok: !!rows, set: new Set((rows || []).map(r => r.student_id + "|" + r.session_id)), any: new Set((rows || []).map(r => String(r.student_id))) };
  return AD.present;
}
// חלון הזמן של קבוצה ביום מסוים (עם מרווח קטן: 10 דק' לפני, 15 אחרי). בלי שעת סיום – שעה וחצי.
function groupWindow(gr, d){
  const hm = (t) => { const m = /^(\d{1,2}):(\d{2})/.exec(t || ""); return m ? Number(m[1]) * 60 + Number(m[2]) : null; };
  const st = hm(gr.start) ?? hm(gr.time); if (st == null) return null;
  const en = hm(gr.end) ?? st + 90;
  const base = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  return [base + (st - 10) * 60e3, base + (en + 15) * 60e3];
}
const isLive = (gr, now) => { now = now || new Date(); if (gr.day !== DAY_L[now.getDay()]) return false; const w = groupWindow(gr, now); return !!w && now >= w[0] && now <= w[1]; };
// באיזה שיעור נלחץ "סיימתי": קבוצה של התלמיד/ה שהזמן מתאים לה, או null (= מחוץ לשיעור)
function doneInGroup(sid, doneAt){
  if (!doneAt || !AD.groups) return null;
  const d = new Date(doneAt);
  return AD.groups.find(gr => gr.kids.has(String(sid)) && gr.day === DAY_L[d.getDay()] && (w => w && d >= w[0] && d <= w[1])(groupWindow(gr, d))) || null;
}
function doneChip(sid, doneAt, gr){
  if (!doneAt) return "";
  const inG = doneInGroup(sid, doneAt), d = new Date(doneAt), today = new Date().toDateString() === d.toDateString();
  if (inG && gr && inG.id === gr.id && today) return `<span class="chip ok">✓ סיים/ה בשיעור הזה</span>`;
  if (inG) return `<span class="chip ok">בשיעור · ${esc(today ? "היום" : "יום " + inG.day + "'")} ${esc(inG.time)}</span>`;
  return `<span class="chip warn" title="נלחץ מחוץ לשעות השיעור">מחוץ לשיעור</span>`;
}

async function waitGroupsHtml(g, list, fresh){

// בחירה: מקצוע → כיתה → חלק · חיפוש בכל הספרים · ⭐ חשובים · כרטיסי נושא עם תמונה

  const info = {}; (AD.ws || []).forEach(r => { if (!info[r.book]) info[r.book] = { subj: /^ENG/i.test(r.book) ? "eng" : "math", grade: r.grade || "", part: r.part || ({ A: "א", B: "ב" })[String(r.book).slice(-1)] || "", label: r.book_label || r.book }; });
  return info;

function bankTopicsOf(kind){
  const m = new Map();
  AD.ws.filter(r => r.book === AD.bank.book && r.kind === kind).forEach(r => {
    if (!m.has(r.topic_no)) m.set(r.topic_no, { no: r.topic_no, name: r.topic_name, chapters: r.chapters, kind, pages: [], answers: [] });
    m.get(r.topic_no)[r.type === "page" ? "pages" : "answers"].push(r);

function bankMatch(t, k){

  const cand = new Map(); AD.ws.filter(r => r.book === AD.bank.book && r.kind === k).forEach(r => { if (!cand.has(r.topic_no)) cand.set(r.topic_no, r.topic_name); });

    ${pick ? "" : `<div class="mode-sw" role="tablist"><button data-mode="0" class="${multi ? "" : "on"}">${IC.book} עיון</button><button data-mode="1" class="${multi ? "on" : ""}">${IC.send} שליחה לתלמידים</button></div>`}</div>`;

  if (multi) h += `<div class="multi-hint">${IC.send}<span>מצב שליחה: לחיצה על דף מסמנת אותו. אפשר לסמן מכמה נושאים, ואז "בחירת תלמידים" למטה.</span></div>`;
  h += `<div id="wsTop">${pickHtml ? `<div class="ws-quick"><div class="wq-row">${pickHtml}</div></div>` : ""}<div class="ws-search"><span class="ws-s-ic" aria-hidden="true">🔍</span><input id="bkSearch" type="search" placeholder="${pick ? "חיפוש נושא או דף" : "חיפוש נושא או דף בכל הספרים - למשל: שברים, פרבולה, Past simple"}" value="${esc(AD.bank.q || "")}" autocomplete="off">${q ? `<button type="button" class="ws-s-x" id="clrSearch" aria-label="ניקוי">✕</button>` : ""}</div>
</div>`;

  // כרטיס דף (כמו במערכת הניהול) + סימון בבחירה
  const card = (r) => { const st = inPlan.get(r.id);
    return `<div class="ws-pgw${AD.bank.sel.has(r.id) ? " sel" : ""}${st ? " inplan" : ""}"><button type="button" class="ws-pg" data-w="${esc(r.id)}"><div class="th">${r.is_star ? `<span class="ws-pstar" title="דף חשוב">⭐</span>` : ""}<img data-p="${esc(r.storage_path)}" alt="" loading="lazy">
      ${selMode ? `<span class="pk-tick">${IC.check}</span>` : ""}${st ? `<span class="pk-st chip ${st === "הושלם" ? "ok" : st === "נשלח" ? "new" : "acc"}">${st === "מתוכנן" ? "בתור" : st === "נשלח" ? "נשלח" : "סיים"}</span>` : ""}</div>
      <div class="cap"><b>${r.type === "answers" ? "" : esc(String(r.page_no || ""))}</b><span>${esc(r.title || "")}</span></div></button></div>`; };
  const stTile = (r, label, sub) => `<div class="ws-st${AD.bank.sel.has(r.id) ? " sel" : ""}"><div class="th" data-w="${esc(r.id)}"><img data-p="${esc(r.storage_path)}" alt="" loading="lazy">${selMode ? `<span class="pk-tick">${IC.check}</span>` : ""}</div><div class="cp cp2"><b>${esc(label)}</b>${sub ? `<span>${esc(sub)}</span>` : ""}</div>
    <button type="button" class="go" data-${selMode ? "w" : "cp"}="${esc(r.id)}">${selMode ? (AD.bank.sel.has(r.id) ? "✓ נבחר" : "בחירה") : "העתקה"}</button></div>`;

  let body = "";
  if (searching) {
    // ---- חיפוש בכל הספרים (בבחירה לתלמיד/ה – רק במקצוע שלו/ה) ----
    const qn = wsNorm(q), m = new Map();
    AD.ws.filter(r => r.type === "page" && books.includes(r.book)).forEach(r => {
      const k = r.book + "|" + r.kind + "|" + r.topic_no;
      if (!m.has(k)) m.set(k, { r, n: 0, topic: false, hits: [], first: null });
      const t = m.get(k); t.n++; if (!t.first || (r.sort_order || 0) < (t.first.sort_order || 0)) t.first = r;
      if (wsNorm(r.topic_name).includes(qn)) t.topic = true; else if (wsNorm(r.sub).includes(qn) || wsNorm(r.title).includes(qn)) t.hits.push(r);
    });
    const res = [...m.values()].filter(t => t.topic || t.hits.length)
      .sort((a, b) => bookRank(a.r.book) - bookRank(b.r.book) || a.r.book.localeCompare(b.r.book) || WS_KIND_ORD.indexOf(a.r.kind) - WS_KIND_ORD.indexOf(b.r.kind) || a.r.topic_no.localeCompare(b.r.topic_no, undefined, { numeric: true }));
    const hl = (s) => { s = String(s || ""); const i = wsNorm(s).indexOf(qn); return i < 0 ? esc(s) : esc(s.slice(0, i)) + "<mark>" + esc(s.slice(i, i + qn.length)) + "</mark>" + esc(s.slice(i + qn.length)); };
    if (!res.length) body = `<div class="ws-empty">לא נמצא נושא או דף עם <b>"${esc(q)}"</b>.<div class="muted">אפשר לנסות מילה קצרה יותר.</div></div>`;
    else { let book = null; body = `<div class="ws-res-sum">נמצאו <b>${res.length}</b> נושאים</div>`;
      res.forEach(t => { const r = t.r;
        if (r.book !== book) { if (book !== null) body += "</div>"; book = r.book; body += `<h3 class="ws-res-book">${esc(r.book_label)}</h3><div class="ws-res">`; }
        const cover = t.hits[0] || t.first;
        body += `<div class="ws-rc k-${esc(r.kind)}" data-go="${esc(r.book + "|" + r.kind + "|" + r.topic_no)}" role="button" tabindex="0">
          <div class="ws-rc-th"><img data-p="${esc(cover.storage_path)}" alt="" loading="lazy"></div>
          <div class="ws-rc-b"><div class="ws-rc-t">נושא ${esc(String(Number(r.topic_no) || r.topic_no))} · ${hl(r.topic_name)}</div>
            ${t.hits.length ? `<ul class="ws-rc-hits">${t.hits.slice(0, 2).map(x => `<li>דף ${esc(String(x.page_no))} · ${hl(x.title || x.sub || "")}</li>`).join("")}${t.hits.length > 2 ? `<li class="more">ועוד ${t.hits.length - 2} דפים</li>` : ""}</ul>` : ""}
            <div class="ws-rc-n">${t.n} ${esc(r.kind === "summary" ? "דפי סיכום" : r.kind === "topic" ? "דפי תרגול" : WS_KIND[r.kind] || r.kind)} ←</div></div></div>`; });
      body += "</div>"; }
  } else if (!AD.bank.topic) {
    // ---- רשימת הנושאים: "לפי נושאים" קודם, ובסוף נושאים שיש רק בסוג אחר ----
    if (!kindOut) AD.bank.kind = kinds[0];
    let tops = bankTopicsOf(AD.bank.kind);
    if (!kindOut) kinds.slice(1).forEach(k => bankTopicsOf(k).forEach(t => { if (!bankMatch(t, kinds[0])) tops.push(t); }));
    // בבחירה לתלמיד/ה: מהנושא האחרון בתוכנית והלאה
    const fr = pick && AD.bank.from && AD.bank.from.book === AD.bank.book ? AD.bank.from : null;
    let frNo = null;
    if (fr) { const ft = tops.find(t => t.kind === fr.kind && t.no === fr.topic) || tops.find(t => bankMatch(t, fr.kind) === fr.topic); frNo = ft ? ft.kind + "|" + ft.no : null; }
    const frIdx = frNo ? tops.findIndex(t => t.kind + "|" + t.no === frNo) : -1;
    const hiddenN = frIdx > 0 && !AD.bank.showAll ? frIdx : 0;
    if (hiddenN) tops = tops.slice(frIdx);
    const stars = []; tops.forEach(t => t.pages.filter(r => r.is_star).forEach(r => stars.push(stTile(r, String(Number(t.no) || t.no) + ". " + t.name, (r.page_no ? r.page_no + " · " : "") + (r.title || "")))));
    if (stars.length) body += `<div class="ws-stars ws-stars-top"><div class="ws-stars-h"><span>⭐ חשובים${kindOut ? " · " + esc(WS_KIND[AD.bank.kind] || "") : ""}</span></div><div class="ws-stars-row">${stars.join("")}</div></div>`;
    if (fr) body += `<div class="from-note">${hiddenN ? `מהנושא האחרון בתוכנית והלאה · <button class="linkish small" id="showAllT">להציג גם ${hiddenN} נושאים קודמים</button>` : AD.bank.showAll && frIdx > 0 ? `כל הנושאים · <button class="linkish small" id="showAllT">רק מהנושא האחרון</button>` : ""}</div>`;
    body += `<div class="ws-albums">${tops.map(t => { const selN = t.pages.filter(r => AD.bank.sel.has(r.id)).length;
      return `<button type="button" class="ws-album${t.kind + "|" + t.no === frNo ? " here" : ""}" data-t="${esc(t.no)}" data-tk="${esc(t.kind)}">
      <div class="cv">${t.pages[0] ? `<img data-p="${esc(t.pages[0].storage_path)}" alt="" loading="lazy">` : ""}${selN ? `<span class="al-sel">${selN} ✓</span>` : ""}</div>
      <div class="mt"><span class="no">${t.chapters ? esc(/פרק/.test(t.chapters) ? t.chapters : "פרקים " + t.chapters).replace(/(\d+\s*[–-]\s*\d+)/g, '<span dir="ltr">$1</span>') : "נושא " + esc(String(Number(t.no) || t.no))}</span><span class="nm">${esc(t.name)}</span>
        <span class="ch">${esc([t.kind !== AD.bank.kind ? (WS_KIND[t.kind] || t.kind) : "", (t.pages.length === 1 ? "דף אחד" : t.pages.length + " דפים")].filter(Boolean).join(" · "))}${(n => n ? ` · <span class="star">⭐</span> ${n === 1 ? "חשוב אחד" : n + " חשובים"}` : "")(t.pages.filter(r => r.is_star).length)}</span>
        ${t.kind + "|" + t.no === frNo ? `<span class="chip new al-here">כאן נמצא/ת עכשיו</span>` : ""}</div></button>`; }).join("")}</div>`;
  } else {
    // ---- בתוך נושא ----
    const t = bankTopicsOf(AD.bank.kind).find(x => x.no === AD.bank.topic);
    if (!t) { AD.bank.topic = null; return renderBank(T); }
    if (selMode || !t.answers.length) AD.bank.tab = "page";
    const sumNo = AD.bank.tab === "page" && AD.bank.kind === "topic" && !kindOut ? bankMatch(t, "summary") : null;
    const sumT = sumNo ? bankTopicsOf("summary").find(x => x.no === sumNo) : null;
    const list = AD.bank.tab === "page" ? t.pages.concat(sumT ? sumT.pages.map(r => Object.assign({}, r, { _sumG: true })) : []) : t.answers;
    const allStar = t.pages.length && t.pages.every(r => r.is_star);
    const bl = (info[AD.bank.book] || {}).label || "";
    body += `<div class="ws-bar"><h2><span class="ws-bar-sub">${esc(bl)} · נושא ${esc(String(Number(t.no) || t.no))}</span>${esc(t.name)}${t.pages.some(r => r.is_star) ? " ⭐" : ""}</h2>
      ${selMode ? `<button type="button" class="btn small" id="selTopic">${(() => { const fr = t.pages.filter(r => !inPlan.has(r.id)); return fr.length && fr.every(r => AD.bank.sel.has(r.id)) ? "ביטול סימון הנושא" : "סימון כל הנושא"; })()}</button>`
                : `<button type="button" class="btn small ws-tstar${allStar ? " on" : ""}" id="tStar" title="סימון כל הנושא כחשוב">${allStar ? "⭐ חשוב" : "☆ חשוב"}</button>`}
      <button type="button" class="btn small ws-back2" id="tBack" title="חזרה לכל הנושאים">→ חזרה<span class="lg-t"> לנושאים</span></button></div>`;
    if (!selMode && t.answers.length) body += `<div class="ws-sw"><div class="ws-tabs" role="tablist"><button type="button" role="tab" data-tab="page" aria-selected="${AD.bank.tab === "page"}">דפים <small>${t.pages.length}</small></button><button type="button" role="tab" data-tab="ans" aria-selected="${AD.bank.tab !== "page"}">פתרונות <small>${t.answers.length}</small></button></div></div>`;
    const st = list.filter(r => r.is_star && r.type === "page");
    if (st.length && !(allStar && !sumT)) body += `<div class="ws-stars"><div class="ws-stars-h"><span>⭐ חשובים בנושא</span></div><div class="ws-stars-row">${st.map(r => stTile(r, String(r.page_no || ""), r.title || "")).join("")}</div></div>`;
    if (AD.bank.tab !== "page") body += `<div class="ws-warn">פתרונות – לשימוש הצוות בלבד. תלמידים לא מקבלים פתרונות באפליקציה.</div>`;
    const SUMG = "📘 דפי סיכום";
    const grpOf = (r) => r._sumG ? "|" + SUMG : (r.chapter || "") + "|" + (r.sub || "");
    const groups = [];
    list.forEach(r => { const k = grpOf(r);
      if (!groups.length || groups[groups.length - 1].k !== k) groups.push({ k, sum: !!r._sumG, title: r._sumG ? SUMG : (r.sub || ""), chapter: r._sumG ? "" : (r.chapter || ""), rows: [] });
      groups[groups.length - 1].rows.push(r); });
    AD.bank.openG = AD.bank.openG && AD.bank.openG.t === AD.bank.book + AD.bank.kind + AD.bank.topic ? AD.bank.openG : { t: AD.bank.book + AD.bank.kind + AD.bank.topic, s: new Set() };
    if (groups.some(g => g.title || g.chapter)) body += `<div class="ws-grps">` + groups.map(g => { const fd = g.sum, cl = fd && !AD.bank.openG.s.has(g.k);
        const head = g.title || g.chapter ? `<div class="ws-gh" ${fd ? `data-fold="${esc(g.k)}"` : ""}><span>${fd ? `<i class="ws-car" aria-hidden="true">${cl ? "◂" : "▾"}</i>` : ""}<bdi>${esc(g.title)}</bdi>${g.chapter ? `<small>פרק ${esc(g.chapter)}</small>` : ""}${fd ? `<em class="ws-gn">${g.rows.length} דפים</em>` : ""}</span></div>` : "";
        return `<section class="ws-grp${g.rows.length > 4 ? " wide" : ""}${fd ? " fold ws-sumg" : ""}${cl ? " closed" : ""}">${head}<div class="ws-pages">${g.rows.map(card).join("")}</div></section>`; }).join("") + `</div>`;
    else body += `<div class="ws-pages">${list.map(card).join("")}</div>`;
  }
  h += `<div id="wsBody">${body}</div>`;
  T.innerHTML = h;

  // ---- חיבורים ----
  const W = (sel) => T.querySelectorAll(sel), one = (sel) => T.querySelector(sel);
  const reset = () => { AD.bank.topic = null; AD.bank.q = ""; AD.bank.showAll = false; };
  W("[data-ws]").forEach(b => b.onclick = () => { const nb = books.find(x => info[x].subj === b.dataset.ws); if (nb) { AD.bank.book = nb; reset(); renderBank(T); } });
  W("[data-wg]").forEach(b => b.onclick = () => { const suf = String(AD.bank.book).slice(-1), g = b.dataset.wg; const nb = books.find(x => info[x].subj === cur.subj && info[x].grade === g && x.slice(-1) === suf) || books.find(x => info[x].subj === cur.subj && info[x].grade === g); if (nb) { AD.bank.book = nb; reset(); renderBank(T); } });
  W("[data-b]").forEach(b => b.onclick = () => { AD.bank.book = b.dataset.b; reset(); renderBank(T); });
  W("[data-wk]").forEach(b => b.onclick = () => { AD.bank.kind = b.dataset.wk; AD.bank.topic = null; renderBank(T); });
  W("[data-t]").forEach(b => b.onclick = () => { AD.bank.listKind = AD.bank.kind; AD.bank.kind = b.dataset.tk; AD.bank.topic = b.dataset.t; AD.bank.tab = "page"; renderBank(T); (T.id === "adBody" ? window : T).scrollTo(0, 0); });
  W("[data-go]").forEach(b => b.onclick = () => { const [bk, k, no] = b.dataset.go.split("|"); AD.bank.book = bk; AD.bank.kind = k; AD.bank.topic = no; AD.bank.q = ""; AD.bank.tab = "page"; renderBank(T); (T.id === "adBody" ? window : T).scrollTo(0, 0); });
  W("[data-tab]").forEach(b => b.onclick = () => { AD.bank.tab = b.dataset.tab; renderBank(T); });
  W("[data-fold]").forEach(b => b.onclick = () => { const s = AD.bank.openG.s; s.has(b.dataset.fold) ? s.delete(b.dataset.fold) : s.add(b.dataset.fold); renderBank(T); });
  W("[data-mode]").forEach(b => b.onclick = () => { const m = b.dataset.mode === "1"; if (m === !!AD.bank.multi) return; AD.bank.multi = m; AD.bank.sel.clear(); AD.bank.tab = "page"; renderBank(T); });
  W("[data-cp]").forEach(b => b.onclick = async () => { const w = AD.wsById.get(b.dataset.cp); if (!w) return; const g = await sign([w.storage_path]); copyImage(g(w.storage_path)); });
  const si = one("#bkSearch");
  if (si) si.oninput = () => { clearTimeout(renderBank._t); renderBank._t = setTimeout(() => { const pos = si.selectionStart; AD.bank.q = si.value; if (AD.bank.q.trim().length >= 2) AD.bank.topic = null; renderBank(T).then(() => { const n = T.querySelector("#bkSearch"); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch(e) {} } }); }, 250); };
  if (one("#clrSearch")) one("#clrSearch").onclick = () => { AD.bank.q = ""; renderBank(T); };
  if (one("#tStar")) one("#tStar").onclick = async () => {
    const pg = AD.ws.filter(r => r.book === AD.bank.book && r.kind === AD.bank.kind && r.topic_no === AD.bank.topic && r.type === "page");
    const on = !pg.every(r => r.is_star); if (await setStar(pg.map(r => r.id), on)) { toast(on ? "כל הנושא סומן כחשוב ⭐" : "הסימון הוסר מהנושא"); renderBank(T); } };
  if (one("#selTopic")) one("#selTopic").onclick = () => {
    const pg = AD.ws.filter(r => r.book === AD.bank.book && r.kind === AD.bank.kind && r.topic_no === AD.bank.topic && r.type === "page" && !inPlan.has(r.id));
    const all = pg.every(r => AD.bank.sel.has(r.id)); pg.forEach(r => all ? AD.bank.sel.delete(r.id) : AD.bank.sel.add(r.id)); renderBank(T); };
  if (one("#showAllT")) one("#showAllT").onclick = () => { AD.bank.showAll = !AD.bank.showAll; renderBank(T); };
  if (one("#tBack")) one("#tBack").onclick = () => { AD.bank.topic = null; if (AD.bank.listKind) AD.bank.kind = AD.bank.listKind; renderBank(T); };
  if (one("#pickCancel")) one("#pickCancel").onclick = () => { const sid = pick.sid, subj = pick.subj; AD.bank.pick = null; AD.bank.sel.clear(); AD.view = "students"; openStudent(sid, subj); };
  W("[data-w]").forEach(b => b.onclick = () => {
    const id = b.dataset.w;
    if (!selMode) return previewWs(id);
    if (inPlan.has(id)) { toast("הדף הזה כבר בתוכנית."); return; }
    AD.bank.sel.has(id) ? AD.bank.sel.delete(id) : AD.bank.sel.add(id);
    const on = AD.bank.sel.has(id);
    T.querySelectorAll(`.ws-pg[data-w="${CSS.escape(id)}"]`).forEach(x => x.parentElement.classList.toggle("sel", on));
    T.querySelectorAll(`.ws-st .th[data-w="${CSS.escape(id)}"], .ws-st .go[data-w="${CSS.escape(id)}"]`).forEach(x => { const st = x.closest(".ws-st"); st.classList.toggle("sel", on); const go = st.querySelector(".go"); if (go) go.textContent = on ? "✓ נבחר" : "בחירה"; });
    pickBar();
  });
  pickBar();
  const imgs = [...T.querySelectorAll("img[data-p]")];
  if (imgs.length) { const g = await sign([...new Set(imgs.map(i => i.dataset.p))]); imgs.forEach(i => { i.src = g(i.dataset.p); }); }
}

function pickBar(){
  const pick = AD.bank.pick;
  if (!pick && AD.bank.multi) {
    const n = AD.bank.sel.size;
    setActionBar(`<span class="sp">${n === 1 ? "נבחר דף אחד" : n ? "נבחרו " + n + " דפים" : "לסמן דפים (אפשר גם מכמה נושאים)"}</span>
      ${n ? `<button class="btn sm ghost" id="mClear">ניקוי</button>` : ""}<button class="btn sm primary" id="mSend" ${n ? "" : "disabled"}>${IC.send} בחירת תלמידים…</button>`, (b) => {
        if (b.querySelector("#mClear")) b.querySelector("#mClear").onclick = () => { AD.bank.sel.clear(); renderBank($("adBody")); };
        b.querySelector("#mSend").onclick = () => bulkSheet();
      });
    return;
  }
  if (!pick) { if (!inDrawer()) setActionBar(null); return; }
  const n = AD.bank.sel.size;
  const html = `<span class="sp">${n === 1 ? "נבחר דף אחד" : n ? "נבחרו " + n + " דפים" : "לבחור דפים"}</span>
    <button class="btn sm" id="pkAdd" ${n ? "" : "disabled"}>הוספה לתור</button>
    <button class="btn sm primary" id="pkAddRel" ${n ? "" : "disabled"}>הוספה ושליחה עכשיו</button>`;
  const wire = (b) => { b.querySelector("#pkAdd").onclick = () => addToPlan(false); b.querySelector("#pkAddRel").onclick = () => addToPlan(true); };
  if (inDrawer()) { $("drawerFoot").innerHTML = html; wire($("drawerFoot")); }
  else setActionBar(html, wire);
}
async function addToPlan(releaseNow){
  const pick = AD.bank.pick; if (!pick || !AD.bank.sel.size) return;
  const ids = AD.ws.filter(r => AD.bank.sel.has(r.id)).map(r => r.id);   // לפי סדר המאגר
  const qq = queueOf(pick.sid, pick.subj); let pos = qq.length ? Math.max(...qq.map(x => x.position)) : 0;
  const rows = ids.map(wid => ({ student_id: isNaN(Number(pick.sid)) ? pick.sid : Number(pick.sid), worksheet_id: isNaN(Number(wid)) ? wid : Number(wid),
                                 subject: wsSubject((AD.wsById.get(wid) || {}).book), position: ++pos }));
  try {
    const res = await insert("portal_plan_items", rows);
    (res || []).forEach(p => AD.plan.push(Object.assign(p, { student_id: String(p.student_id) })));
    AD.bank.sel.clear();
    const sid = pick.sid, subj = pick.subj;
    closeDrawer(true); AD.bank.pick = null;
    if (releaseNow) await releaseItems((res || []).map(p => p.id));
    refreshWaitingLocal();
    toast(releaseNow ? (ids.length === 1 ? "הדף נוסף ונשלח לתלמיד/ה." : ids.length + " דפים נוספו ונשלחו.") : (ids.length === 1 ? "דף אחד נוסף לתור." : ids.length + " דפים נוספו לתור."));
    const st = stById(sid); AD.view = "students"; AD.st = String(sid); AD.subj = subj; AD.sel.clear(); if (st) { window.scrollTo(0, 0); adRender(); }
  } catch(e) { toast(/duplicate|unique/i.test(e.message) ? "חלק מהדפים כבר בתוכנית." : errText(e)); }
}
// ---------- שליחה לכמה תלמידים (לפי קבוצה / יום ושעה, או ידנית) ----------
async function loadGroups(){
  if (AD.groups) return AD.groups;
  const yr = encodeURIComponent('תשפ"ז');
  try {
    const [ss, asg] = await Promise.all([
      get("session_summary", "select=*&school_year=eq." + yr),
      getAll("assignments", "select=session_id,student_id&status=in.(" + encodeURIComponent("משובץ") + "," + encodeURIComponent("ממתין") + ")")
    ]);
    const kids = new Map(); (asg || []).forEach(a => { const k = String(a.session_id); if (!kids.has(k)) kids.set(k, new Set()); kids.get(k).add(String(a.student_id)); });
    const DO = { "א":1,"ב":2,"ג":3,"ד":4,"ה":5,"ו":6 };
    AD.groups = (ss || []).map(g => ({ id: String(g.session_id), city: g.city || "", day: g.day || "", time: g.time_label || String(g.start_time || "").slice(0, 5), loc: g.location || "",
                                        start: String(g.start_time || "").slice(0, 5), end: String(g.end_time || "").slice(0, 5), kids: kids.get(String(g.session_id)) || new Set() }))
      .filter(g => g.kids.size).sort((a, b) => a.city.localeCompare(b.city) || (DO[a.day] || 9) - (DO[b.day] || 9) || String(a.start).localeCompare(String(b.start)));
  } catch(e) { AD.groups = []; }
  return AD.groups;
}
async function presentToday(sessionId){
  const d = new Date(), iso = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  try { const r = await get("attendance", "select=student_id&present=is.true&lesson_date=eq." + iso + "&session_id=eq." + sessionId); return new Set((r || []).map(x => String(x.student_id))); }
  catch(e) { return null; }
}
async function bulkSheet(){
  let wids = AD.ws.filter(r => AD.bank.sel.has(r.id)).map(r => r.id);
  const subs = [...new Set(wids.map(w => wsSubject((AD.wsById.get(w) || {}).book)))];
  if (subs.length > 1) { toast("אפשר לשלוח יחד רק דפים מאותו מקצוע."); return; }
  const subj = subs[0];
  const groups = await loadGroups();
  const cities = [...new Set(groups.map(g => g.city))];
  // עיר ברירת מחדל: זו שיש בה הכי הרבה ילדים מתאימים
  const cityN = (c) => groups.filter(g => g.city === c).reduce((n, g) => n + AD.students.filter(st => g.kids.has(st.student_id) && (st.subjects || []).includes(subj)).length, 0);
  const B = { q: "", city: cities.slice().sort((a, b) => cityN(b) - cityN(a))[0] || "", grp: "", today: false, todaySet: null, sel: new Set() };
  const elig = AD.students.filter(s => (s.subjects || []).includes(subj));
  const status = (sid) => { const pl = planOf(sid); const st = wids.map(w => (pl.find(p => String(p.worksheet_id) === w) || {}).status).filter(Boolean);
    return st.length === wids.length && wids.length ? (st.every(x => x !== "מתוכנן") ? "יש" : "בתור") : st.length ? "חלק" : ""; };
  const dayName = { "א":"א'","ב":"ב'","ג":"ג'","ד":"ד'","ה":"ה'","ו":"ו'" };
  const g0 = await sign(wids.map(w => (AD.wsById.get(w) || {}).storage_path));
  openSheet(`
    <div class="bk-head"><div><h2>שליחת דפים לתלמידים</h2><div class="small muted"><span class="subj-chip ${subjCls(subj)} on sm">${esc(subj)}</span> רק תלמידים שרשומים ל${esc(subj)}</div></div>
      <button class="icon-btn dark" id="bkClose" aria-label="סגירה">${IC.x}</button></div>
    <div class="bk-grid">
      <section class="bk-pages"><div class="bk-sec">הדפים שנבחרו · <span id="bkPN"></span></div><div class="bk-plist" id="bkPages"></div></section>
      <section class="bk-who">
        <div class="bk-sec">למי לשלוח</div>
        ${groups.length ? `<div class="bk-cities">${cities.map(c => `<button data-city="${esc(c)}">${esc(c)}</button>`).join("")}</div>
          <div class="bk-groups" id="bkGroups"></div>
          <label class="chk bk-today" id="bkTodayL" hidden><input type="checkbox" id="bkToday"> רק מי שסומן/ה נוכח/ת היום</label>` : ""}
        <div class="bk-searchrow"><label class="bank-search">${IC.search}<input id="bkQ" type="search" placeholder="חיפוש לפי שם"></label>
          <label class="chk"><input type="checkbox" id="bkAll"> כולם</label></div>
        <div class="bk-list" id="bkList"></div>
      </section>
    </div>
    <div class="bk-foot"><div class="bk-sum" id="bkSum"></div><button class="btn" id="bkQueue" disabled>הוספה לתור</button><button class="btn primary" id="bkSend" disabled>${IC.send} שליחה עכשיו</button></div>`, (sh) => {
      const $$ = (s) => sh.querySelector(s);
      const curGroup = () => groups.find(x => x.id === B.grp);
      const list = () => { let L = elig;
        if (B.grp) { const g = curGroup(); L = L.filter(s => g && g.kids.has(s.student_id)); if (B.today && B.todaySet) L = L.filter(s => B.todaySet.has(s.student_id)); }
        if (B.q.trim()) L = L.filter(s => stName(s).includes(B.q.trim()));
        return L; };
      const drawPages = () => {
        $$("#bkPN").textContent = wids.length;
        $$("#bkPages").innerHTML = wids.map(w => { const r = AD.wsById.get(w) || {};
          return `<div class="bk-pg"><span class="thumb" style="background-image:url('${esc(g0(r.storage_path))}')"></span><div class="t">${esc(r.title || "")}<small>${esc(String(Number(r.topic_no) || r.topic_no || ""))} · ${esc(r.topic_name || "")}</small></div>
            ${wids.length > 1 ? `<button class="mini" data-rmw="${esc(w)}" aria-label="הסרה">${IC.x}</button>` : ""}</div>`; }).join("");
        sh.querySelectorAll("[data-rmw]").forEach(b => b.onclick = () => { wids = wids.filter(x => x !== b.dataset.rmw); AD.bank.sel.delete(b.dataset.rmw); drawPages(); draw(); });
      };
      const drawGroups = () => {
        if (!$$("#bkGroups")) return;
        sh.querySelectorAll("[data-city]").forEach(b => b.classList.toggle("on", b.dataset.city === B.city));
        const gs = groups.filter(g => g.city === B.city);
        $$("#bkGroups").innerHTML = `<button class="gchip all ${!B.grp ? "on" : ""}" data-g="">כל התלמידים</button>` +
          gs.map(g => { const n = elig.filter(s => g.kids.has(s.student_id)).length;
            return `<button class="gchip ${B.grp === g.id ? "on" : ""}" data-g="${esc(g.id)}" ${n ? "" : "disabled"}><b>${esc(dayName[g.day] || g.day)} ${esc(g.time)}</b><small>${esc(g.loc)}</small><span class="n">${n}</span></button>`; }).join("");
        sh.querySelectorAll("[data-g]").forEach(b => b.onclick = async () => {
          B.grp = b.dataset.g; B.today = false; B.todaySet = null; $$("#bkToday").checked = false; $$("#bkTodayL").hidden = true;
          if (B.grp) { const g = curGroup(); B.sel = new Set(elig.filter(s => g.kids.has(s.student_id) && status(s.student_id) !== "יש").map(s => s.student_id)); }
          drawGroups(); draw();
          if (B.grp) { const id = B.grp, t = await presentToday(id); if (B.grp !== id) return; B.todaySet = t; $$("#bkTodayL").hidden = !(t && t.size); }
        });
      };
      const draw = () => {
        const L = list();
        $$("#bkList").innerHTML = L.map(s => { const st = status(s.student_id), dis = st === "יש";
          return `<label class="bk-row ${dis ? "dis" : ""} ${B.sel.has(s.student_id) ? "on" : ""}"><input type="checkbox" data-s="${esc(s.student_id)}" ${B.sel.has(s.student_id) ? "checked" : ""} ${dis ? "disabled" : ""}>
            ${avatar(s)}<span class="who"><b>${esc(stName(s))}</b><small>${esc(stMeta(s))}</small></span>
            <span class="tags">${st === "יש" ? `<span class="chip ok">כבר נשלח</span>` : st === "בתור" ? `<span class="chip acc">בתור</span>` : st === "חלק" ? `<span class="chip">חלק כבר יש</span>` : ""}${!s.has_account ? `<span class="chip">בלי חשבון</span>` : ""}</span></label>`; }).join("")
          || `<div class="bk-empty">${B.today ? "אף אחד לא סומן נוכח היום בקבוצה הזו." : "אין תלמידים מתאימים."}</div>`;
        sh.querySelectorAll("[data-s]").forEach(c => c.onchange = () => { c.checked ? B.sel.add(c.dataset.s) : B.sel.delete(c.dataset.s); c.closest(".bk-row").classList.toggle("on", c.checked); foot(); });
        const able = L.filter(s => status(s.student_id) !== "יש");
        $$("#bkAll").checked = able.length > 0 && able.every(s => B.sel.has(s.student_id));
        foot();
      };
      const foot = () => { const n = B.sel.size, p = wids.length;
        $$("#bkSum").innerHTML = n ? `<b>${p === 1 ? "דף אחד" : p + " דפים"}</b> ← <b>${n === 1 ? "תלמיד/ה אחד/ת" : n + " תלמידים"}</b>` : `<span class="muted">לבחור תלמידים</span>`;
        $$("#bkQueue").disabled = $$("#bkSend").disabled = !n || !p; };
      sh.querySelectorAll("[data-city]").forEach(b => b.onclick = () => { B.city = b.dataset.city; drawGroups(); });
      if ($$("#bkToday")) $$("#bkToday").onchange = (e) => { B.today = e.target.checked; if (B.today && B.todaySet) B.sel = new Set([...B.sel].filter(x => B.todaySet.has(x))); draw(); };
      $$("#bkQ").oninput = (e) => { B.q = e.target.value; draw(); };
      $$("#bkAll").onchange = (e) => { list().filter(s => status(s.student_id) !== "יש").forEach(s => e.target.checked ? B.sel.add(s.student_id) : B.sel.delete(s.student_id)); draw(); };
      $$("#bkQueue").onclick = () => bulkSend([...B.sel], wids, false);
      $$("#bkSend").onclick = () => bulkSend([...B.sel], wids, true);
      $$("#bkClose").onclick = () => { closeSheet(); pickBar(); renderBank($("adBody")); };
      drawPages(); drawGroups(); draw();
    }, "wide");
}
async function bulkSend(sids, wids, releaseNow){
  const rows = [], toRelease = [];
  sids.forEach(sid => {
    const pl = planOf(sid); let pos = Math.max(0, ...pl.filter(p => p.status === "מתוכנן").map(p => p.position));
    wids.forEach(w => { const ex = pl.find(p => String(p.worksheet_id) === w);
      if (!ex) rows.push({ student_id: isNaN(Number(sid)) ? sid : Number(sid), worksheet_id: isNaN(Number(w)) ? w : Number(w), subject: wsSubject((AD.wsById.get(w) || {}).book), position: ++pos });
      else if (ex.status === "מתוכנן" && releaseNow) toRelease.push(ex.id); });
  });
  try {
    let added = [];
    if (rows.length) {
      added = await api("POST", "/rest/v1/portal_plan_items?on_conflict=student_id,worksheet_id", rows, { "Prefer": "return=representation,resolution=ignore-duplicates" }) || [];
      added.forEach(p => AD.plan.push(Object.assign(p, { student_id: String(p.student_id) })));
    }
    if (releaseNow) {
      const ids = [...toRelease, ...added.map(p => p.id)];
      if (ids.length) { await rpc("portal_release", { p_items: ids }); const now = new Date().toISOString();
        AD.plan.forEach(p => { if (ids.includes(p.id)) { p.status = "נשלח"; p.released_at = now; p.done_at = null; p.seen_at = null; } }); }
    }
    refreshWaitingLocal(); closeSheet(); AD.bank.sel.clear(); AD.bank.multi = false;
    toast(releaseNow ? "נשלח ל-" + sids.length + (sids.length === 1 ? " תלמיד/ה." : " תלמידים.") : "נוסף לתור של " + sids.length + (sids.length === 1 ? " תלמיד/ה." : " תלמידים."));
    adRender();
  } catch(e) { toast(errText(e)); }
}
async function previewWs(wid){
  const w = AD.wsById.get(String(wid)); if (!w) return;
  const g = await sign([w.storage_path]);
  openViewer({ title: w.title, path: w.storage_path, url: g(w.storage_path),
    bar: `${w.type === "page" ? `<button class="btn ghost" id="vStar">${w.is_star ? "⭐ חשוב" : "☆ חשוב"}</button>` : ""}<button class="btn ghost" id="vCopy">${IC.copy} העתקה</button><button class="btn ghost" id="vSave">${IC.save} שמירה</button>`,
    wire: (v) => { v.querySelector("#vCopy").onclick = () => copyImage(g(w.storage_path)); v.querySelector("#vSave").onclick = () => saveImage(g(w.storage_path), w.title);
      if (v.querySelector("#vStar")) v.querySelector("#vStar").onclick = async () => { if (await setStar([w.id], !w.is_star)) { v.querySelector("#vStar").textContent = w.is_star ? "⭐ חשוב" : "☆ חשוב"; STAR_DIRTY = true; } }; } });
}
