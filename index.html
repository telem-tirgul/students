<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>תלם שלי</title>
<meta name="theme-color" content="#5A1216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="תלם שלי">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800;900&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F3EF; --paper:#FFFFFF; --ink:#2B2320; --ink-soft:#6B5F55; --border:#E5DDD3;
    --accent:#5A1216; --accent-ink:#FFFFFF; --accent-soft:#F3E3E4; --gold:#C9A45C; --muted:#F1ECE6;
    --ok:#3F7D4F; --ok-bg:#E5F1E8; --warn:#B7791F; --warn-bg:#FBF0DC; --bad:#B3423F;
    --font-display:'Heebo','Segoe UI',sans-serif; --font-body:'Assistant','Segoe UI',sans-serif;
    --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17110F; --paper:#231B18; --ink:#F3ECE6; --ink-soft:#BBA99B; --border:#3E322C;
      --accent:#E2707A; --accent-ink:#1A0F0E; --accent-soft:#3A1D20; --gold:#E3B765; --muted:#2E2420;
      --ok:#6CC082; --ok-bg:#1D3324; --warn:#E3B765; --warn-bg:#3A2C14; --bad:#FF8A80;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17110F; --paper:#231B18; --ink:#F3ECE6; --ink-soft:#BBA99B; --border:#3E322C;
    --accent:#E2707A; --accent-ink:#1A0F0E; --accent-soft:#3A1D20; --gold:#E3B765; --muted:#2E2420;
    --ok:#6CC082; --ok-bg:#1D3324; --warn:#E3B765; --warn-bg:#3A2C14; --bad:#FF8A80;
    color-scheme: dark;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; min-height:100%; }
  body{ background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.5; }
  button,input,select,textarea{ font:inherit; color:inherit; }
  h1,h2,h3{ font-family:var(--font-display); margin:0; text-wrap:balance; }
  [hidden]{ display:none !important; }
  .wrap{ max-width:560px; margin:0 auto; padding:0 16px; }
  .wrap.wide{ max-width:980px; }

  /* top bar */
  .top{ position:sticky; top:0; z-index:30; background:var(--accent); color:#fff; padding-top:var(--safe-t); }
  :root[data-theme="dark"] .top{ background:#3A1416; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .top{ background:#3A1416; } }
  .top .row{ display:flex; align-items:center; gap:10px; min-height:58px; }
  .top img{ height:34px; background:#fff; border-radius:8px; padding:2px 5px; }
  .top .ttl{ font-family:var(--font-display); font-weight:800; font-size:18px; line-height:1.2; flex:1; min-width:0; }
  .top .ttl small{ display:block; font-weight:500; font-size:12.5px; opacity:.8; }
  .icon-btn{ background:none; border:none; color:inherit; width:44px; height:44px; border-radius:12px; display:grid; place-items:center; cursor:pointer; flex:none; }
  .icon-btn:active{ background:rgba(255,255,255,.15); }
  .icon-btn svg{ width:24px; height:24px; }
  .tabs{ display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; }
  .tabs button{ background:none; border:none; color:rgba(255,255,255,.75); padding:10px 14px; font-weight:700; font-family:var(--font-display);
                border-bottom:3px solid transparent; cursor:pointer; white-space:nowrap; }
  .tabs button.on{ color:#fff; border-bottom-color:var(--gold); }
  .badge{ display:inline-block; min-width:20px; padding:0 6px; border-radius:10px; background:var(--gold); color:#2B2320; font-size:12px; font-weight:800; text-align:center; margin-inline-start:4px; line-height:20px; }

  /* basic blocks */
  main{ padding:16px 0 calc(110px + var(--safe-b)); }
  .card{ background:var(--paper); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:12px; }
  .muted{ color:var(--ink-soft); }
  .small{ font-size:14px; }
  .sec-h{ font-family:var(--font-display); font-weight:800; font-size:15px; color:var(--ink-soft); margin:20px 2px 8px; display:flex; align-items:center; gap:8px; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:0 18px; border-radius:14px;
        border:1px solid var(--border); background:var(--paper); font-weight:700; font-family:var(--font-display); cursor:pointer; text-decoration:none; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.ok{ background:var(--ok); border-color:var(--ok); color:#fff; }
  .btn.ghost{ background:none; }
  .btn.sm{ min-height:38px; padding:0 12px; border-radius:11px; font-size:14px; }
  .btn.block{ width:100%; }
  .btn:disabled{ opacity:.5; cursor:default; }
  .btn svg{ width:20px; height:20px; }
  .field{ display:block; margin-bottom:14px; }
  .field span{ display:block; font-weight:700; margin-bottom:6px; font-size:15px; }
  .field input, .field select{ width:100%; min-height:52px; border:1px solid var(--border); border-radius:14px; background:var(--paper); padding:0 14px; font-size:18px; }
  .field input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .code-input{ letter-spacing:.35em; text-align:center; direction:ltr; font-family:var(--font-display) !important; font-weight:800; }
  .ltr{ direction:ltr; unicode-bidi:embed; }
  .err{ color:var(--bad); font-weight:700; min-height:1.5em; }
  .chip{ display:inline-flex; align-items:center; gap:4px; padding:2px 10px; border-radius:20px; font-size:13px; font-weight:700; background:var(--muted); color:var(--ink-soft); }
  .chip.new{ background:var(--gold); color:#2B2320; }
  .chip.ok{ background:var(--ok-bg); color:var(--ok); }
  .chip.warn{ background:var(--warn-bg); color:var(--warn); }
  .chip.acc{ background:var(--accent-soft); color:var(--accent); }
  .chip.bad{ background:color-mix(in srgb, var(--bad) 14%, transparent); color:var(--bad); }
  .ic-line{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--paper); border:1px solid var(--border); border-radius:12px; padding:8px 12px; margin:0 0 10px; font-size:14px; }
  .ic-line b.code{ font-family:ui-monospace,monospace; letter-spacing:2px; direction:ltr; }
  .bulk-btn{ width:100%; margin:0 0 10px; }
  .res-list{ margin:6px 0 12px; padding:0; list-style:none; max-height:40vh; overflow:auto; }
  .res-list li{ padding:6px 2px; border-bottom:1px solid var(--border); font-size:14px; }
  .toast{ position:fixed; inset-inline:16px; bottom:calc(20px + var(--safe-b)); margin:0 auto; max-width:480px; background:#2B2320; color:#fff; border-radius:14px; padding:14px 16px; font-weight:700; z-index:100; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.25); }
  .empty{ text-align:center; padding:36px 16px; }
  .empty svg{ width:56px; height:56px; color:var(--gold); }

  /* login */
  .login{ min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:24px 0 calc(24px + var(--safe-b)); }
  .login .logo{ display:block; height:84px; margin:0 auto 14px; background:#fff; border-radius:16px; padding:6px 10px; }
  .login h1{ text-align:center; font-size:26px; margin-bottom:4px; }
  .login p.lead{ text-align:center; margin:0 0 22px; }
  .linkish{ background:none; border:none; color:var(--accent); font-weight:700; cursor:pointer; padding:10px; text-decoration:underline; }

  /* student pages */
  .seg{ display:flex; background:var(--muted); border-radius:14px; padding:4px; gap:4px; margin-bottom:6px; }
  .seg button{ flex:1; border:none; background:none; min-height:44px; border-radius:11px; font-weight:800; font-family:var(--font-display); cursor:pointer; color:var(--ink-soft); }
  .seg button.on{ background:var(--paper); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .page-card{ display:flex; gap:14px; align-items:center; width:100%; text-align:start; background:var(--paper); border:1px solid var(--border);
              border-radius:16px; padding:10px; margin-bottom:10px; cursor:pointer; }
  .page-card.is-new{ border-color:var(--gold); box-shadow:0 0 0 2px color-mix(in srgb, var(--gold) 35%, transparent); }
  .thumb{ display:block; width:76px; aspect-ratio:210/297; border-radius:8px; background:var(--muted) center/cover no-repeat; flex:none; border:1px solid var(--border); }
  .page-card .t{ font-family:var(--font-display); font-weight:800; font-size:17px; line-height:1.3; }
  .page-card .s{ font-size:14px; color:var(--ink-soft); margin-top:2px; }
  .page-card .go{ margin-inline-start:auto; color:var(--ink-soft); flex:none; }
  .done-row{ display:flex; align-items:center; gap:10px; padding:12px 4px; border-bottom:1px solid var(--border); cursor:pointer; background:none; border-inline:none; border-top:none; width:100%; text-align:start; }
  .done-row svg{ width:22px; height:22px; color:var(--ok); flex:none; }
  details.dt{ padding:0; margin:0 0 10px; overflow:hidden; }
  details.dt > summary{ list-style:none; display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; min-height:56px; }
  details.dt > summary::-webkit-details-marker{ display:none; }
  .dt-no{ flex:none; min-width:32px; height:32px; padding:0 6px; border-radius:10px; background:var(--accent-soft); color:var(--accent); font-family:var(--font-display); font-weight:800; display:grid; place-items:center; font-size:15px; }
  .dt-name{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .dt-name b{ font-family:var(--font-display); font-weight:700; font-size:16px; line-height:1.3; }
  .dt-name small{ color:var(--ink-soft); font-size:13px; }
  .dt-car{ flex:none; font-style:normal; color:var(--ink-soft); font-size:14px; }
  .dt-car::after{ content:"◂"; }
  details.dt[open] .dt-car::after{ content:"▾"; }
  .dt-body{ padding:0 14px 6px; border-top:1px solid var(--border); }
  .dt-body .done-row:last-child{ border-bottom:none; }
  .dt-sub{ font-size:13px; font-weight:700; color:var(--ink-soft); padding:12px 2px 2px; }
  .dt-book{ font-family:var(--font-display); font-weight:700; font-size:13px; color:var(--ink-soft); margin:14px 4px 6px; }

  /* viewer */
  .viewer{ position:fixed; inset:0; z-index:60; background:#111; display:flex; flex-direction:column; overscroll-behavior:contain; }
  /* דף פתוח: כל המסך כהה (גם מאחורי פס הכתובת / אזור הבית בטלפון) והעמוד מאחור לא זז – בלי פס לבן למטה (1.12.1) */
  html.vw-open, html.vw-open body{ background:#111 !important; background-image:none !important; overflow:hidden; overscroll-behavior:none; }
  html.vw-open body{ position:fixed; inset-inline:0; width:100%; }
  .viewer .vtop{ display:flex; align-items:center; gap:6px; padding:calc(6px + var(--safe-t)) 8px 6px; color:#fff; background:#111; }
  .viewer .vtop .ttl{ flex:1; font-family:var(--font-display); font-weight:800; font-size:16px; line-height:1.25; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .viewer .stage{ flex:1; overflow:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; background:#2a2a2a; touch-action:pan-x pan-y pinch-zoom; }
  .viewer .stage{ display:flex; }
  /* הדף ממורכז גם לגובה כשהוא קצר מהמסך (1.12.2); margin:auto – כשמגדילים אין חלק שנחתך */
  .viewer .stage img{ display:block; flex:none; width:100%; height:auto; margin:auto; background:#fff; transition:width .15s; }
  .viewer .vbar{ display:flex; gap:10px; padding:10px 12px calc(10px + var(--safe-b)); background:#111; }
  .viewer .vbar .btn{ flex:1; } .viewer .vbar{ flex-wrap:wrap; } .viewer .vbar [data-pa=up], .viewer .vbar [data-pa=down]{ flex:0 0 auto; }
  .viewer .vbar .btn.ghost{ color:#fff; border-color:#555; }
  .zoom{ display:flex; gap:2px; }

  /* sheet */
  .sheet-bg{ position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; }
  .sheet{ background:var(--paper); width:100%; max-width:560px; max-height:92vh; overflow:auto; border-radius:22px 22px 0 0; padding:18px 18px calc(20px + var(--safe-b)); }
  @media (min-width:700px){ .sheet-bg{ align-items:center; } .sheet{ border-radius:22px; } }
  .sheet h2{ font-size:21px; margin-bottom:10px; }
  .steps{ margin:0; padding:0; list-style:none; counter-reset:s; }
  .steps li{ counter-increment:s; display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--border); }
  .steps li::before{ content:counter(s); flex:none; width:30px; height:30px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-weight:800; font-family:var(--font-display); }
  .kbd{ display:inline-flex; align-items:center; gap:4px; background:var(--muted); border:1px solid var(--border); border-radius:8px; padding:0 6px; font-weight:700; white-space:nowrap; }
  .kbd svg{ width:16px; height:16px; }
  .install-banner{ display:flex; gap:12px; align-items:center; background:var(--accent-soft); border:1px solid color-mix(in srgb, var(--accent) 25%, transparent); }
  .install-banner svg{ width:30px; height:30px; color:var(--accent); flex:none; }
  .install-banner .x{ margin-inline-start:auto; }

  /* manager */
  .search{ width:100%; min-height:48px; border:1px solid var(--border); border-radius:14px; padding:0 14px; background:var(--paper); font-size:16px; margin-bottom:10px; }
  .filters{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .filters button{ border:1px solid var(--border); background:var(--paper); border-radius:20px; padding:6px 12px; font-weight:700; cursor:pointer; font-size:14px; }
  .filters button.on{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .st-row{ display:flex; flex-wrap:nowrap; align-items:center; gap:8px; width:100%; text-align:start; background:var(--paper); border:1px solid var(--border); border-radius:10px; padding:5px 8px; margin-bottom:4px; cursor:pointer; min-height:44px; }
  .st-row .sr-t{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px; overflow:hidden; }
  .st-row .sr-l1, .st-row .sr-l2{ display:flex; align-items:center; gap:5px; min-width:0; overflow:hidden; }
  .st-row .sr-t .n{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; line-height:1.25; }
  .st-row .sr-l2 .school-chip, .st-row .sr-l2 .subj-mini{ font-size:11.5px; line-height:1.45; }
  .st-row .sr-t .school-chip{ flex:0 10 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .st-row .subj-mini{ flex:none; }
  .st-row .sr-ic{ flex:none; display:flex; flex-wrap:nowrap; gap:3px; align-items:center; margin-inline-start:auto; }
  .st-row .sr-ic:empty{ display:none; }
  .school-chip{ display:inline-block; background:var(--scb); color:var(--sci); font-weight:700; border-radius:999px; padding:0 8px; line-height:1.5; font-size:12px; white-space:nowrap; }
  .sc-rh1{ --l:#FFF0A6; --h:#5E4B00; } .sc-rh2{ --l:#FFC94D; --h:#5A3E00; } .sc-rh3{ --l:#F59A3C; --h:#4A2400; }
  .sc-rh4{ --l:#C9663A; --h:#FFFFFF; --d:#7A3315; } .sc-rh5{ --l:#8A5530; --h:#FFFFFF; --d:#4A2A12; }
  .sc-ks1{ --l:#D8F0B0; --h:#3A5A10; } .sc-ks2{ --l:#5FB35A; --h:#FFFFFF; --d:#2D6A29; } .sc-ks3{ --l:#2E6E4A; --h:#FFFFFF; --d:#173D27; } .sc-ks4{ --l:#9ED3C0; --h:#11493A; --d:#1C6B55; }
  .sc-hs1{ --l:#CDE6FA; --h:#174A80; } .sc-hs2{ --l:#4F93D9; --h:#FFFFFF; --d:#1F5A9E; } .sc-hs3{ --l:#1E3F7A; --h:#FFFFFF; --d:#0D2147; } .sc-hs4{ --l:#B9B4EC; --h:#2E2670; --d:#4A3FA8; }
  .sc-x{ --l:#ECE9E7; --h:#5F5A57; }
  .sc{ --scb:var(--l); --sci:var(--h); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .sc{ --scb:color-mix(in srgb, var(--l) 42%, #231B18); --sci:color-mix(in srgb, var(--l) 30%, #fff); } }
  :root[data-theme="dark"] .sc{ --scb:color-mix(in srgb, var(--l) 42%, #231B18); --sci:color-mix(in srgb, var(--l) 30%, #fff); }
  .si{ font-style:normal; font-size:12.5px; font-weight:800; line-height:1; min-width:22px; height:22px; padding:0 4px; border-radius:6px; display:inline-grid; place-items:center; background:var(--muted); color:var(--ink-soft); }
  .si-here{ background:#4ea30c; color:#fff; } .si-abs{ background:#D93A2F; color:#fff; } .si-here-l{ color:#4ea30c; } .si-abs-l{ color:#D93A2F; }
  .si-did{ font-size:11.5px; color:var(--ink-soft); font-weight:600; margin-inline-start:-1px; }
  .st-row .sr-t .subj-mini, .st-row .sr-t .si{ flex:none; } .si-wait{ background:#FFF4D6; } .si-q{ background:#F3E3E3; color:var(--accent); } .si-open{ background:#E7EEF8; color:#2F5E94; }
  .si-bad{ background:#FBE3E1; } .si-noacc{ background:transparent; }
  .si-ex{ background:var(--paper); border:1.5px solid var(--border); color:var(--ink); font-size:11.5px; cursor:pointer; } .si-ex.soon{ background:#FBE3E1; border-color:#E8A49D; color:#A3261D; } .si-ex.near{ background:#FCEFEE; border-color:#F0C5C0; color:#B84A42; }
  .si-study{ background:transparent; cursor:pointer; } .si-ex-l{ font-weight:800; color:#A3261D; }
  .st-leg{ display:flex; flex-wrap:wrap; gap:4px 10px; font-size:11.5px; color:var(--ink-soft); margin:0 2px 6px; }
  .gbadge{ display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:50%; font-weight:800; font-size:11.5px; letter-spacing:-.3px; flex:none; background:var(--gb); color:var(--gi); border:2px solid var(--gi); }
  .g-ה, .g-ו{ --gb:#E2EEFA; --gi:#2F78C4; } .g-ז{ --gb:#DFF3E8; --gi:#24935F; } .g-ח{ --gb:#FCEBD9; --gi:#C86E14; } .g-ט{ --gb:#ECE5FA; --gi:#7B55C9; }
  .g-י{ --gb:#F3F0C6; --gi:#857400; } .g-יא{ --gb:#F8E1EE; --gi:#B8327F; } .g-יב{ --gb:#EFE6DC; --gi:#6E5236; } .g-x{ --gb:transparent; --gi:var(--ink-soft); }
  .subj-mini{ display:inline-block; font-size:12px; font-weight:700; line-height:1.5; border-radius:999px; padding:0 8px; }
  .subj-mini.s-m{ background:#DDF5D6; color:#1F6B17; } .subj-mini.s-e{ background:#FFF6B8; color:#6B5600; } .subj-mini.s-b{ background:#DCEAFB; color:#1D4F91; } .subj-mini.s-x{ background:var(--muted); color:var(--ink-soft); }
  .st-row .n{ font-family:var(--font-display); font-weight:800; font-size:16px; }
  .st-row .meta{ font-size:13.5px; color:var(--ink-soft); }
  .st-row .chips{ display:flex; gap:4px; flex-wrap:wrap; margin-inline-start:auto; justify-content:flex-end; }
  .wait-card .head{ display:flex; gap:10px; align-items:flex-start; }
  .wait-card .head .n{ font-family:var(--font-display); font-weight:800; font-size:17px; }
  .wait-card .next{ margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .grid2{ display:grid; grid-template-columns:1fr; gap:12px; }
  @media (min-width:860px){ .grid2{ grid-template-columns:1fr 1fr; } }
  .plan-item{ display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); }
  .plan-item:last-child{ border-bottom:none; }
  .plan-item .thumb{ width:44px; border-radius:5px; cursor:zoom-in; }
  @media (max-width:480px){ .plan-item .thumb{ display:none; } }
  .plan-item .t{ flex:1; min-width:0; font-weight:700; line-height:1.3; }
  .plan-item .t small{ display:block; font-weight:400; color:var(--ink-soft); font-size:13px; }
  .plan-item .pos{ width:26px; text-align:center; font-weight:800; color:var(--ink-soft); font-family:var(--font-display); }
  .mini{ background:none; border:1px solid var(--border); border-radius:9px; width:34px; height:34px; display:grid; place-items:center; cursor:pointer; flex:none; color:var(--ink-soft); }

const AUTH_KEY = "telem_portal_auth";
let auth = null;

function saveAuth(a){ auth = a; store(AUTH_KEY, a ? JSON.stringify(a) : null); }
function baseHeaders(){
  const h = { "apikey": CONFIG.anonKey, "Content-Type": "application/json" };
  if (CONFIG.anonKey.indexOf("eyJ") === 0) h["Authorization"] = "Bearer " + CONFIG.anonKey;
  return h;
}
async function tokenRequest(grant, body){
  const res = await fetch(CONFIG.supabaseUrl + "/auth/v1/token?grant_type=" + grant, { method:"POST", headers: baseHeaders(), body: JSON.stringify(body) });

let REFRESHING = null;

      catch(e) {

}

                                                       body: body === undefined ? undefined : JSON.stringify(body) });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    const err = new Error(e.message || e.msg || ("HTTP " + res.status)); err.status = res.status; err.code = e.code; throw err;
  }

}

// עדכון מיידי (Supabase Realtime – ערוץ Broadcast פרטי, TS-06)
// השרת שולח "צלצול" בלי פרטים; האפליקציה מושכת את הנתונים כרגיל.
// אם אין חיבור – נשארת הבדיקה הרגילה (כל 20 / 15 שניות).
// ======================================================================
const RT = { ws: null, topic: null, onPing: null, live: false, ref: 0, hb: null, retry: 0, rt: null, deb: null, want: false };
function jwtClaims(t){ try { const p = t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"); return JSON.parse(decodeURIComponent(escape(atob(p + "===".slice((p.length + 3) % 4))))) || {}; } catch(e) { return {}; } }
function jwtSub(t){ try { const p = t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"); return JSON.parse(atob(p + "===".slice((p.length + 3) % 4))).sub || null; } catch(e) { return null; } }
function rtSend(o){ try { if (RT.ws && RT.ws.readyState === 1) RT.ws.send(JSON.stringify(o)); } catch(e) {} }
function rtStart(topic, onPing){

}
function rtStop(){

}
async function rtConnect(){
  if (!RT.want || typeof WebSocket === "undefined") return;

  let ws;
  try { ws = new WebSocket(CONFIG.supabaseUrl.replace(/^http/, "ws") + "/realtime/v1/websocket?apikey=" + encodeURIComponent(CONFIG.anonKey) + "&vsn=1.0.0"); }
  catch(e) { return rtLater(); }

             payload: { config: { broadcast: { self: false, ack: false }, presence: { key: "" }, postgres_changes: [], private: true }, access_token: t } });
    clearInterval(RT.hb);

  };

}
function rtLater(){ if (!RT.want) return; clearTimeout(RT.rt); RT.rt = setTimeout(rtConnect, Math.min(30000, 2000 * Math.pow(2, RT.retry++))); }
// כמה הודעות ברצף (למשל שליחת כמה דפים) – רענון אחד
function rtPing(){ clearTimeout(RT.deb); RT.deb = setTimeout(() => { try { RT.onPing && RT.onPing(); } catch(e) {} }, 400); }
// טוקן חדש – מעדכנים את הערוץ (אחרת הוא נסגר כשהטוקן פג)
function rtToken(t){ if (RT.live && RT.ws) rtSend({ topic: "realtime:" + RT.topic, event: "access_token", payload: { access_token: t }, ref: String(++RT.ref) }); }

const URLS = {};
async function sign(paths){
  const now = Date.now(), need = [...new Set(paths.filter(p => p && (!URLS[p] || URLS[p].exp < now + 120000)))];
  for (let i = 0; i < need.length; i += 100) {
    const part = need.slice(i, i + 100);
    try {
      const res = await api("POST", "/storage/v1/object/sign/worksheets", { expiresIn: 3600, paths: part });
      (res || []).forEach(r => { if (r.signedURL) URLS[r.path] = { url: CONFIG.supabaseUrl + "/storage/v1" + r.signedURL, exp: now + 3600 * 1000 }; });
    } catch(e) {}
  }
  return (p) => URLS[p] ? URLS[p].url + (WS_VER[p] ? "&v=" + WS_VER[p] : "") : "";
}

  }

// "סיימתי" מסודר כמו במאגר: ספר → נושא → תת-נושא, ובתוכם לפי סדר הדפים
function doneByTopic(done){
  const num = (x) => { const n = parseFloat(x); return isNaN(n) ? 1e9 : n; };
  const kOrd = (k) => { const i = ["topic", "summary", "grammar", "unseen", "vocab", "general"].indexOf(k); return i < 0 ? 9 : i; };
  const rows = done.slice().sort((a, b) =>
    bookRank(a.book || "") - bookRank(b.book || "") || String(a.book || "").localeCompare(String(b.book || "")) ||
    kOrd(a.kind) - kOrd(b.kind) || num(a.topic_no) - num(b.topic_no) || String(a.topic_name || "").localeCompare(String(b.topic_name || "")) ||
    num(a.sort_order) - num(b.sort_order) || num(a.page_no) - num(b.page_no) || String(a.title || "").localeCompare(String(b.title || "")));
  const topics = [];
  rows.forEach(p => {
    const k = [p.book || "", p.kind || "", p.topic_no || "", p.topic_no ? "" : (p.topic_name || "")].join("|");

    const no = p.topic_no ? String(Number(p.topic_no) || p.topic_no) : "";
    const meta = [kinds.size > 1 && p.kind ? (WS_KIND[p.kind] || "") : "", t.rows.length === 1 ? "דף אחד" : t.rows.length + " דפים"].filter(Boolean).join(" · ");
    // תתי-נושאים: לפי הסדר במאגר, כותרת רק כשיש
    const subs = []; t.rows.forEach(r => { const s = r.sub || ""; if (!subs.length || subs[subs.length - 1].s !== s) subs.push({ s, rows: [] }); subs[subs.length - 1].rows.push(r); });
    const inner = subs.some(x => x.s) ? subs.map(x => (x.s ? `<div class="dt-sub">${esc(x.s)}</div>` : "") + x.rows.map(row).join("")).join("") : t.rows.map(row).join("");
    h += `<details class="dt card" data-k="${esc(t.k)}" ${ST.openT.has(t.k) ? "open" : ""}><summary>${no ? `<span class="dt-no">${esc(no)}</span>` : ""}<span class="dt-name"><b>${esc(p.topic_name || "בלי נושא")}</b><small>${esc(meta)}</small></span><i class="dt-car" aria-hidden="true"></i></summary><div class="dt-body">${inner}</div></details>`;
  });
  return h;
}

  $("sheetHost").innerHTML = `<div class="sheet-bg"><div class="sheet ${cls || ""}" role="dialog" aria-modal="true">${html}</div></div>`;
  SHEET = $("sheetHost").firstElementChild;
  SHEET.addEventListener("click", (e) => { if (e.target === SHEET) closeSheet(); });

}

let AD_POLLING = false;
async function adPoll(){
  if (AD_POLLING || $("adminView").hidden || !AD.loaded || !auth) return;
  AD_POLLING = true;
  try {
    const plan = (await getAll("portal_plan_items", "select=id,student_id,worksheet_id,subject,position,status,released_at,done_at,seen_at&order=position,id"))
      .map(p => Object.assign(p, { student_id: String(p.student_id) }));
    let reqs = AD.codeReqs || [];
    try { reqs = (await get("portal_code_requests", "select=id,student_id,phone,created_at&handled_at=is.null&matched=is.true&order=created_at"))
            .map(r => Object.assign(r, { student_id: String(r.student_id) })).filter(r => stById(r.student_id)); } catch(e) {}
    const sig = (P, R) => JSON.stringify([P.map(p => [p.id, p.status, p.seen_at ? 1 : 0]), R.map(r => r.id)]);
    if (sig(plan, reqs) === sig(AD.plan, AD.codeReqs || [])) return;
    const beforeW = new Set(waitingList().map(w => w.s.student_id + "|" + w.subj)), beforeR = new Set((AD.codeReqs || []).map(r => r.id));
    AD.plan = plan; AD.codeReqs = reqs; refreshWaitingLocal();
    const newW = waitingList().filter(w => !beforeW.has(w.s.student_id + "|" + w.subj)), newR = AD.codeReqs.filter(r => !beforeR.has(r.id));
    if (newW.length || newR.length) {
      const names = [...newW.map(w => stName(w.s).trim()), ...newR.map(r => stName(stById(r.student_id)).trim() + " (קוד)")];
      const msg = newW.length && !newR.length ? (newW.length === 1 ? `🔔 ${names[0]} סיים/ה דף ומחכה לדף הבא` : `🔔 ${newW.length} תלמידים מחכים לדף: ${names.join(", ")}`)
                : `🔔 ${names.join(", ")}`;
      toast(msg, 9000); beep();
      try { if (window.Notification && Notification.permission === "granted" && document.hidden) new Notification("תלם שלי", { body: msg.replace("🔔 ", ""), icon: "icon-192.png", tag: "telem-wait" }); } catch(e) {}
    }
    // מרעננים את המסך רק כשאין חלון פתוח (כדי לא להפריע באמצע עבודה)
    if (!SHEET && $("drawer").hidden && AD.view === "wait" && !AD.st) renderWait();
    else if (!SHEET && !VIEWER && $("drawer").hidden && AD.st && !AD.bank.pick) rerenderPlan();   // 1.15: גם מסך התלמיד/ה מתעדכן
  } catch(e) {}
  finally { AD_POLLING = false; updateTitle(); }
}

function adBusy(on){ document.body.classList.toggle("ad-busy", !!on); }
async function adLoad(){
  adBusy(true);
  const opt = (p) => p.catch(e => { if (e && e.message === "not signed in") throw e; return undefined; });
  try {
    const [students, plan, settings, reqs] = await Promise.all([
      rpc("portal_students"),
      getAll("portal_plan_items", "select=id,student_id,worksheet_id,subject,position,status,released_at,done_at,seen_at&order=position,id"),
      opt(rpc("portal_settings_get")),   // קוד ראשוני לכולם (TS-05; אם לא הורץ – null)
      opt(get("portal_code_requests", "select=id,student_id,phone,created_at&handled_at=is.null&matched=is.true&order=created_at")),   // "שכחתי את הקוד"
      loadWs()
    ]);
    AD.students = (students || []).map(s => Object.assign(s, { student_id: String(s.student_id) }));
    AD.plan = (plan || []).map(p => Object.assign(p, { student_id: String(p.student_id) }));
    AD.settings = settings === undefined ? null : settings;
    AD.codeReqs = (reqs || []).map(r => Object.assign(r, { student_id: String(r.student_id) })).filter(r => stById(r.student_id));
    AD.loaded = true;
  } catch(e) {
    adBusy(false);
    if (e.message === "not signed in") return;
    if (AD.fromCache) { toast("לא הצלחנו לעדכן – מוצג המצב האחרון."); return; }
    $("adBody").innerHTML = `<div class="card err">${e.code === "PGRST202" || e.status === 404 ? "צריך להריץ את קובץ 72.1 ב-Supabase." : "לא הצלחנו לטעון. " + esc(errText(e))}</div>`; return;
  }
  const wasCache = AD.fromCache; AD.fromCache = false; adBusy(false); AD_CACHE.save();
  // אם כבר עובדים על משהו (חלון, דף פתוח, מאגר) – לא לקפוץ; רק לעדכן את מה שבטוח

  adRender();

  Promise.all([loadGroups(), presentAllToday(), loadInfo()]).then(() => { if (AD.view === "students" && !AD.st && !SHEET) adRender(); }).catch(() => {});
}
async function loadWs(force){
  if (AD.ws && !force) return;
  let cached = null; try { cached = JSON.parse(store(WS_CACHE) || "null"); } catch(e) {}
  const setWs = (rows) => { AD.ws = rows.map(r => Object.assign(r, { id: String(r.id) })); AD.wsById = new Map(AD.ws.map(r => [r.id, r])); };
  if (cached && cached.rows && cached.rows.length && !force) {
    setWs(cached.rows);
    wsFetch().then(fresh => { try { store(WS_CACHE, JSON.stringify({ t: Date.now(), rows: fresh })); } catch(e) {} setWs(fresh); }).catch(() => {});
    return;
  }
  try { const fresh = await wsFetch(); try { store(WS_CACHE, JSON.stringify({ t: Date.now(), rows: fresh })); } catch(e) {} setWs(fresh); }
  catch(e) { AD.ws = AD.ws || []; }
}

function waitingList(){
  const out = [];
  AD.students.forEach(s => (s.waiting_subjects || []).forEach(subj => {
    const last = planOf(s.student_id, subj).filter(p => p.done_at).sort((a, b) => b.done_at.localeCompare(a.done_at))[0];
    out.push({ s, subj, done_at: last ? last.done_at : s.last_done_at, last });
  }));
  return out.sort((a, b) => String(a.done_at || "").localeCompare(String(b.done_at || "")));   // הכי מזמן – ראשון
}

// ---------- ממתינים לפי קבוצות: עיר → מקום תרגול → יום ושעה ----------

async function presentAllToday(){
  const iso = todayIso();

  if (AD.presentP && AD.presentP.iso === iso) return AD.presentP.p;   // כבר בדרך

  try { const all = await get("attendance", "select=student_id,session_id,present,did_math,did_english&lesson_date=eq." + iso).catch(() => get("attendance", "select=student_id,session_id,present&lesson_date=eq." + iso));
    (all || []).forEach(r => { if (r.present && (r.did_math || r.did_english)) did.set(String(r.student_id), { m: !!r.did_math, e: !!r.did_english }); });

}
// חלון הזמן של קבוצה ביום מסוים (עם מרווח קטן: 10 דק' לפני, 15 אחרי). בלי שעת סיום – שעה וחצי.

function todaySections(list, rowFn){
  const today = DAY_L[new Date().getDay()];
  const gs = (AD.groups || []).filter(g => g.day === today).sort((a, b) => String(a.start || a.time).localeCompare(String(b.start || b.time)));

  const used = new Set(), here = (id) => !!(AD.present && AD.present.any.has(id));

    if (!kids.length) return; kids.forEach(s => used.add(s.student_id));

// 1.18.2: גרירת דף בתור (⋮⋮) – משנה את הסדר; בסוף שומרים את המיקומים כמו ▲▼
function dragQueue(h){
  h.addEventListener("pointerdown", (e) => {
    const row = h.closest(".stm-row"), box = row.parentElement; if (!box) return;
    e.preventDefault(); h.setPointerCapture(e.pointerId);
    const rows = [...box.querySelectorAll(".stm-row")], y0 = e.clientY, r0 = row.getBoundingClientRect();
    const mids = rows.map(r => { const b = r.getBoundingClientRect(); return b.top + b.height / 2; });
    let to = rows.indexOf(row); const from = to;
    row.classList.add("dragging");
    const move = (ev) => { const dy = ev.clientY - y0; row.style.transform = `translateY(${dy}px)`;
      const c = r0.top + r0.height / 2 + dy; to = mids.filter((m, k) => k !== from && m < c).length;
      rows.forEach((r, k) => { if (r === row) return; const k2 = k > from ? k - 1 : k; r.style.transform = k2 >= to && k < from ? `translateY(${r0.height + 6}px)` : k2 < to && k > from ? `translateY(${-(r0.height + 6)}px)` : ""; }); };
    const up = () => { h.removeEventListener("pointermove", move); h.removeEventListener("pointerup", up); h.removeEventListener("pointercancel", up);
      rows.forEach(r => r.style.transform = ""); row.classList.remove("dragging");
      if (to !== from) reorderQueue(Number(row.dataset.pid), to); };
    h.addEventListener("pointermove", move); h.addEventListener("pointerup", up); h.addEventListener("pointercancel", up);
  });
}
async function reorderQueue(id, to){
  const p = AD.plan.find(x => x.id === id); if (!p) return;
  const qq = queueOf(p.student_id, p.subject), i = qq.findIndex(x => x.id === id); if (i < 0) return;
  qq.splice(to, 0, qq.splice(i, 1)[0]);
  const changes = []; qq.forEach((x, k) => { if (x.position !== k + 1) { x.position = k + 1; changes.push(x); } });
  rerenderPlan();
  try { await Promise.all(changes.map(x => patch("portal_plan_items", "id=eq." + x.id, { position: x.position }))); }
  catch(e) { toast("הסדר לא נשמר. כדאי לרענן."); }
}

function startPick(s){
  // ברירת מחדל: אם כבר יש דפים בתוכנית – נפתח על הנושא של הדף האחרון, ומוצגים רק הנושאים ממנו והלאה.
  // אם עוד אין – על הספר של הכיתה (חלק א'), מהנושא הראשון (תחילת השנה).
  const gradeBook = { "ז'": "7A", "ח'": "8A", "ט'": "9A" }[s.grade] || null;
  // 1.12.4: מי שרשום/ה לשני המקצועות – המאגר נפתח עם שניהם, והדף נכנס לתוכנית לפי המקצוע של הדף
  AD.bank.pick = { sid: s.student_id, subj: AD.subj, subjs: (s.subjects && s.subjects.length ? s.subjects : [AD.subj]) };
  AD.bank.sel = new Set(); AD.bank.topic = null; AD.bank.tab = "page"; AD.bank.from = null; AD.bank.showAll = false; AD.bank.fresh = true;
  const books = bankBooks();
  const last = planOf(s.student_id, AD.subj).filter(p => AD.wsById.has(String(p.worksheet_id)))
    .sort((a, b) => b.position - a.position || b.id - a.id)[0];
  const lw = last ? AD.wsById.get(String(last.worksheet_id)) : null;
  if (lw && books.some(b => b[0] === lw.book)) {
    AD.bank.book = lw.book; AD.bank.kind = lw.kind; AD.bank.topic = lw.topic_no;
    AD.bank.from = { book: lw.book, kind: lw.kind, topic: lw.topic_no, title: lw.title };
  } else if (AD.subj === "אנגלית") { AD.bank.book = (books.find(b => wsSubject(b[0]) === "אנגלית") || [null])[0]; AD.bank.kind = "summary"; }
  else { AD.bank.book = gradeBook && books.some(b => b[0] === gradeBook) ? gradeBook : (books.find(b => wsSubject(b[0]) === "מתמטיקה") || [null])[0]; AD.bank.kind = "summary"; }
  if (isDesk()) {
    $("drawerTitle").innerHTML = `הוספת דפים ל<b>${esc(stName(s))}</b> · ${esc(AD.bank.pick.subjs.join(" ו"))}`;

    if (!(history.state && history.state.ad === "bank")) { history.pushState({ ad: "bank", d: navD() + 1 }, ""); AD.bankD = navD(); }
    adRender(); window.scrollTo(0, 0);

  // תלמיד/ה (מהמאגר או מהתוכנית): לפי מצב הדף בתוכנית שלו/ה
  const sid = CB.ctx === "plan" ? CB.plan.s.student_id : AD.bank.pick && AD.bank.pick.sid;
  const p = AD.plan.find(x => x.student_id === String(sid) && String(x.worksheet_id) === String(r.id));
  const hasAcc = (stById(sid) || {}).has_account;
  const B = (a, t, cls) => `<button type="button" class="btn ${cls}" data-pa="${a}">${t}</button>`;
  box.innerHTML = !p ? B("add", "הוסף לתור", "pa-q") + (hasAcc ? B("addrel", "הוסף ושחרר עכשיו", "primary") : "")
    : p.status === "מתוכנן" ? (hasAcc ? B("rel", "שחרר עכשיו", "primary") : "") + B("rm", "הסרה", "pa-rm")
    : p.status === "נשלח" ? B("unrel", "ביטול שחרור (חזרה לתור)", "pa-q") : `<span class="pa-done">✔ סיים/ה את הדף</span>`;
  box.querySelectorAll("[data-pa]").forEach(b => b.onclick = () => { const a = b.dataset.pa;
    if (a === "add" || a === "addrel") { if (CB.ctx === "pick") return cbAdd([String(r.id)], a === "addrel"); CBM.wsClose(); return; }
    CBM.wsClose(); setTimeout(() => { if (a === "rel") releaseItems([p.id]); else if (a === "unrel") unrelease(p.id); else if (a === "rm") removePlan(p.id); }, 60); }); };
CB.onSel = (n) => { const box = CBM.wrap.querySelector("#wsSelApp"); if (!box) return;
  if (!n) { box.innerHTML = ""; return; }
  box.innerHTML = CB.ctx === "pick" ? `<button type="button" class="btn" id="cbSelQ">הוסף לתור</button><button type="button" class="btn primary" id="cbSelRel">הוסף ושחרר עכשיו</button>` : `<button type="button" class="btn" id="cbSelStu">לתלמידים…</button>`;
  if (box.querySelector("#cbSelQ")) { box.querySelector("#cbSelQ").onclick = () => cbAdd(cbIds(), false); box.querySelector("#cbSelRel").onclick = () => cbAdd(cbIds(), true); }
  if (box.querySelector("#cbSelStu")) box.querySelector("#cbSelStu").onclick = () => cbToStudents(cbIds()); };
function pickBar(){
  if (CB_VIS()) { if (!inDrawer()) setActionBar(null); return; }   // 1.18: במאגר – הפס של מערכת הניהול
  const pick = AD.bank.pick;

      ${n ? `<button class="btn sm ghost" id="mClear">ניקוי</button>` : ""}<button class="btn sm primary" id="mSend" ${n ? "" : "disabled"}>${IC.send} בחירת תלמידים…</button>`, (b) => {

  if (inDrawer()) { $("drawerFoot").innerHTML = html; wire($("drawerFoot")); }

async function addToPlan(releaseNow){
  const pick = AD.bank.pick; if (!pick || !AD.bank.sel.size) return;
  const ids = AD.ws.filter(r => AD.bank.sel.has(r.id)).map(r => r.id);   // לפי סדר המאגר
  const posBy = {};   // מקום בתור – לכל מקצוע בנפרד
  const rows = ids.map(wid => { const subject = wsSubject((AD.wsById.get(wid) || {}).book);
    if (!(subject in posBy)) { const qq = queueOf(pick.sid, subject); posBy[subject] = qq.length ? Math.max(...qq.map(x => x.position)) : 0; }
    return { student_id: isNaN(Number(pick.sid)) ? pick.sid : Number(pick.sid), worksheet_id: isNaN(Number(wid)) ? wid : Number(wid), subject, position: ++posBy[subject] }; });
  try {
    const res = await insert("portal_plan_items", rows);
    (res || []).forEach(p => AD.plan.push(Object.assign(p, { student_id: String(p.student_id) })));
    AD.bank.sel.clear();
    const sid = pick.sid, subj = (rows[0] && rows[0].subject) || pick.subj;   // חוזרים לתוכנית של המקצוע שנוסף
    closeDrawer(true); AD.bank.pick = null;
    if (releaseNow) await releaseItems((res || []).map(p => p.id));
    refreshWaitingLocal();
    toast(releaseNow ? (ids.length === 1 ? "הדף נוסף ונשלח לתלמיד/ה." : ids.length + " דפים נוספו ונשלחו.") : (ids.length === 1 ? "דף אחד נוסף לתור." : ids.length + " דפים נוספו לתור."));
    const inline = !isDesk();
    AD.hl = new Set((res || []).map(p => p.id)); setTimeout(() => { AD.hl = null; document.querySelectorAll(".stm-row.hl").forEach(x => x.classList.remove("hl")); }, 4000);
    AD.stTab = releaseNow ? "now" : "queue";
    if (inline) { navBackTo(AD.bankD); AD.bankD = 0; }
    const st = stById(sid); if (!inline) AD.view = "students"; AD.st = String(sid); AD.subj = subj; AD.sel.clear(); if (st) { window.scrollTo(0, 0); adRender(); }
  } catch(e) { toast(/duplicate|unique/i.test(e.message) ? "חלק מהדפים כבר בתוכנית." : errText(e)); }
}
// ---------- שליחה לכמה תלמידים (לפי קבוצה / יום ושעה, או ידנית) ----------
async function loadGroups(){
  if (AD.groups) return AD.groups;
  const yr = encodeURIComponent('תשפ"ז');
  try {
    const [ss, asg] = await Promise.all([
      get("session_summary", "select=*&school_year=eq." + yr),
      getAll("assignments", "select=session_id,student_id&status=in.(" + encodeURIComponent("משובץ") + "," + encodeURIComponent("ממתין") + ")")
    ]);
    const kids = new Map(); (asg || []).forEach(a => { const k = String(a.session_id); if (!kids.has(k)) kids.set(k, new Set()); kids.get(k).add(String(a.student_id)); });
    const DO = { "א":1,"ב":2,"ג":3,"ד":4,"ה":5,"ו":6 };
    AD.groups = (ss || []).map(g => ({ id: String(g.session_id), city: g.city || "", day: g.day || "", time: g.time_label || String(g.start_time || "").slice(0, 5), loc: g.location || "",
                                        start: String(g.start_time || "").slice(0, 5), end: String(g.end_time || "").slice(0, 5), kids: kids.get(String(g.session_id)) || new Set() }))
      .filter(g => g.kids.size).sort((a, b) => a.city.localeCompare(b.city) || (DO[a.day] || 9) - (DO[b.day] || 9) || String(a.start).localeCompare(String(b.start)));
  } catch(e) { AD.groups = []; }
  return AD.groups;
}
async function presentToday(sessionId){
  const d = new Date(), iso = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  try { const r = await get("attendance", "select=student_id&present=is.true&lesson_date=eq." + iso + "&session_id=eq." + sessionId); return new Set((r || []).map(x => String(x.student_id))); }
  catch(e) { return null; }
}
async function bulkSheet(){
  let wids = AD.ws.filter(r => AD.bank.sel.has(r.id)).map(r => r.id);
  const subs = [...new Set(wids.map(w => wsSubject((AD.wsById.get(w) || {}).book)))];
  if (subs.length > 1) { toast("אפשר לשלוח יחד רק דפים מאותו מקצוע."); return; }
  const subj = subs[0];
  const groups = await loadGroups();
  const cities = [...new Set(groups.map(g => g.city))];
  // עיר ברירת מחדל: זו שיש בה הכי הרבה ילדים מתאימים
  const cityN = (c) => groups.filter(g => g.city === c).reduce((n, g) => n + AD.students.filter(st => g.kids.has(st.student_id) && (st.subjects || []).includes(subj)).length, 0);
  const B = { q: "", city: cities.slice().sort((a, b) => cityN(b) - cityN(a))[0] || "", grp: "", today: false, todaySet: null, sel: new Set() };
  const elig = AD.students.filter(s => (s.subjects || []).includes(subj));
  const status = (sid) => { const pl = planOf(sid); const st = wids.map(w => (pl.find(p => String(p.worksheet_id) === w) || {}).status).filter(Boolean);
    return st.length === wids.length && wids.length ? (st.every(x => x !== "מתוכנן") ? "יש" : "בתור") : st.length ? "חלק" : ""; };
  const dayName = { "א":"א'","ב":"ב'","ג":"ג'","ד":"ד'","ה":"ה'","ו":"ו'" };
  const g0 = await sign(wids.map(w => (AD.wsById.get(w) || {}).storage_path));
  openSheet(`
    <div class="bk-head"><div><h2>שליחת דפים לתלמידים</h2><div class="small muted"><span class="subj-chip ${subjCls(subj)} on sm">${esc(subj)}</span> רק תלמידים שרשומים ל${esc(subj)}</div></div>
      <button class="icon-btn dark" id="bkClose" aria-label="סגירה">${IC.x}</button></div>
    <div class="bk-grid">
      <section class="bk-pages"><div class="bk-sec">הדפים שנבחרו · <span id="bkPN"></span></div><div class="bk-plist" id="bkPages"></div></section>
      <section class="bk-who">
        <div class="bk-sec">למי לשלוח</div>
        ${groups.length ? `<div class="bk-cities">${cities.map(c => `<button data-city="${esc(c)}">${esc(c)}</button>`).join("")}</div>
          <div class="bk-groups" id="bkGroups"></div>
          <label class="chk bk-today" id="bkTodayL" hidden><input type="checkbox" id="bkToday"> רק מי שסומן/ה נוכח/ת היום</label>` : ""}
        <div class="bk-searchrow"><label class="bank-search">${IC.search}<input id="bkQ" type="search" placeholder="חיפוש לפי שם"></label>
          <label class="chk"><input type="checkbox" id="bkAll"> כולם</label></div>
        <div class="bk-list" id="bkList"></div>
      </section>
    </div>
    <div class="bk-foot"><div class="bk-sum" id="bkSum"></div><button class="btn" id="bkQueue" disabled>הוספה לתור</button><button class="btn primary" id="bkSend" disabled>${IC.send} שליחה עכשיו</button></div>`, (sh) => {
      const $$ = (s) => sh.querySelector(s);
      const curGroup = () => groups.find(x => x.id === B.grp);
      const list = () => { let L = elig;
        if (B.grp) { const g = curGroup(); L = L.filter(s => g && g.kids.has(s.student_id)); if (B.today && B.todaySet) L = L.filter(s => B.todaySet.has(s.student_id)); }
        if (B.q.trim()) L = L.filter(s => stName(s).includes(B.q.trim()));
        return L; };
      const drawPages = () => {
        $$("#bkPN").textContent = wids.length;
        $$("#bkPages").innerHTML = wids.map(w => { const r = AD.wsById.get(w) || {};
          return `<div class="bk-pg"><span class="thumb" style="background-image:url('${esc(g0(r.storage_path))}')"></span><div class="t">${esc(r.title || "")}<small>${esc(String(Number(r.topic_no) || r.topic_no || ""))} · ${esc(r.topic_name || "")}</small></div>
            ${wids.length > 1 ? `<button class="mini" data-rmw="${esc(w)}" aria-label="הסרה">${IC.x}</button>` : ""}</div>`; }).join("");
        sh.querySelectorAll("[data-rmw]").forEach(b => b.onclick = () => { wids = wids.filter(x => x !== b.dataset.rmw); AD.bank.sel.delete(b.dataset.rmw); drawPages(); draw(); });
      };
      const drawGroups = () => {
        if (!$$("#bkGroups")) return;
        sh.querySelectorAll("[data-city]").forEach(b => b.classList.toggle("on", b.dataset.city === B.city));
        const gs = groups.filter(g => g.city === B.city);
        $$("#bkGroups").innerHTML = `<button class="gchip all ${!B.grp ? "on" : ""}" data-g="">כל התלמידים</button>` +
          gs.map(g => { const n = elig.filter(s => g.kids.has(s.student_id)).length;
            return `<button class="gchip ${B.grp === g.id ? "on" : ""}" data-g="${esc(g.id)}" ${n ? "" : "disabled"}><b>${esc(dayName[g.day] || g.day)} ${esc(g.time)}</b><small>${esc(g.loc)}</small><span class="n">${n}</span></button>`; }).join("");
        sh.querySelectorAll("[data-g]").forEach(b => b.onclick = async () => {
          B.grp = b.dataset.g; B.today = false; B.todaySet = null; $$("#bkToday").checked = false; $$("#bkTodayL").hidden = true;
          if (B.grp) { const g = curGroup(); B.sel = new Set(elig.filter(s => g.kids.has(s.student_id) && status(s.student_id) !== "יש").map(s => s.student_id)); }
          drawGroups(); draw();
          if (B.grp) { const id = B.grp, t = await presentToday(id); if (B.grp !== id) return; B.todaySet = t; $$("#bkTodayL").hidden = !(t && t.size); }
        });
      };
      const draw = () => {
        const L = list();
        $$("#bkList").innerHTML = L.map(s => { const st = status(s.student_id), dis = st === "יש";
          return `<label class="bk-row ${dis ? "dis" : ""} ${B.sel.has(s.student_id) ? "on" : ""}"><input type="checkbox" data-s="${esc(s.student_id)}" ${B.sel.has(s.student_id) ? "checked" : ""} ${dis ? "disabled" : ""}>
            ${avatar(s)}<span class="who"><b>${esc(stName(s))}</b><small>${esc(stMeta(s))}</small></span>
            <span class="tags">${st === "יש" ? `<span class="chip ok">כבר נשלח</span>` : st === "בתור" ? `<span class="chip acc">בתור</span>` : st === "חלק" ? `<span class="chip">חלק כבר יש</span>` : ""}${!s.has_account ? `<span class="chip">בלי חשבון</span>` : ""}</span></label>`; }).join("")
          || `<div class="bk-empty">${B.today ? "אף אחד לא סומן נוכח היום בקבוצה הזו." : "אין תלמידים מתאימים."}</div>`;
        sh.querySelectorAll("[data-s]").forEach(c => c.onchange = () => { c.checked ? B.sel.add(c.dataset.s) : B.sel.delete(c.dataset.s); c.closest(".bk-row").classList.toggle("on", c.checked); foot(); });
        const able = L.filter(s => status(s.student_id) !== "יש");
        $$("#bkAll").checked = able.length > 0 && able.every(s => B.sel.has(s.student_id));
        foot();
      };
      const foot = () => { const n = B.sel.size, p = wids.length;
        $$("#bkSum").innerHTML = n ? `<b>${p === 1 ? "דף אחד" : p + " דפים"}</b> ← <b>${n === 1 ? "תלמיד/ה אחד/ת" : n + " תלמידים"}</b>` : `<span class="muted">לבחור תלמידים</span>`;
        $$("#bkQueue").disabled = $$("#bkSend").disabled = !n || !p; };
      sh.querySelectorAll("[data-city]").forEach(b => b.onclick = () => { B.city = b.dataset.city; drawGroups(); });
      if ($$("#bkToday")) $$("#bkToday").onchange = (e) => { B.today = e.target.checked; if (B.today && B.todaySet) B.sel = new Set([...B.sel].filter(x => B.todaySet.has(x))); draw(); };
      $$("#bkQ").oninput = (e) => { B.q = e.target.value; draw(); };
      $$("#bkAll").onchange = (e) => { list().filter(s => status(s.student_id) !== "יש").forEach(s => e.target.checked ? B.sel.add(s.student_id) : B.sel.delete(s.student_id)); draw(); };
      $$("#bkQueue").onclick = () => bulkSend([...B.sel], wids, false);
      $$("#bkSend").onclick = () => bulkSend([...B.sel], wids, true);
      $$("#bkClose").onclick = () => { closeSheet(); pickBar(); renderBank($("adBody")); };
      drawPages(); drawGroups(); draw();
    }, "wide");
}
async function bulkSend(sids, wids, releaseNow){
  const rows = [], toRelease = [];
  sids.forEach(sid => {
    const pl = planOf(sid); let pos = Math.max(0, ...pl.filter(p => p.status === "מתוכנן").map(p => p.position));
    wids.forEach(w => { const ex = pl.find(p => String(p.worksheet_id) === w);
      if (!ex) rows.push({ student_id: isNaN(Number(sid)) ? sid : Number(sid), worksheet_id: isNaN(Number(w)) ? w : Number(w), subject: wsSubject((AD.wsById.get(w) || {}).book), position: ++pos });
      else if (ex.status === "מתוכנן" && releaseNow) toRelease.push(ex.id); });
  });
  try {
    let added = [];
    if (rows.length) {
      added = await api("POST", "/rest/v1/portal_plan_items?on_conflict=student_id,worksheet_id", rows, { "Prefer": "return=representation,resolution=ignore-duplicates" }) || [];
      added.forEach(p => AD.plan.push(Object.assign(p, { student_id: String(p.student_id) })));
    }
    if (releaseNow) {
      const ids = [...toRelease, ...added.map(p => p.id)];
      if (ids.length) { await rpc("portal_release", { p_items: ids }); const now = new Date().toISOString();
        AD.plan.forEach(p => { if (ids.includes(p.id)) { p.status = "נשלח"; p.released_at = now; p.done_at = null; p.seen_at = null; } }); }
    }
    refreshWaitingLocal(); closeSheet(); AD.bank.sel.clear(); AD.bank.multi = false;
    toast(releaseNow ? "נשלח ל-" + sids.length + (sids.length === 1 ? " תלמיד/ה." : " תלמידים.") : "נוסף לתור של " + sids.length + (sids.length === 1 ? " תלמיד/ה." : " תלמידים."));
    adRender();
  } catch(e) { toast(errText(e)); }
}
async function previewWs(wid){
  const w = AD.wsById.get(String(wid)); if (!w) return;
  const g = await sign([w.storage_path]);
  openViewer({ title: w.title, path: w.storage_path, url: g(w.storage_path),
    bar: `${w.type === "page" ? `<button class="btn ghost" id="vStar">${w.is_star ? "⭐ חשוב" : "☆ חשוב"}</button>` : ""}<button class="btn ghost" id="vCopy">${IC.copy} העתקה</button><button class="btn ghost" id="vSave">${IC.save} שמירה</button>`,
    wire: (v) => { v.querySelector("#vCopy").onclick = () => copyImage(g(w.storage_path)); v.querySelector("#vSave").onclick = () => saveImage(g(w.storage_path), w.title);
      if (v.querySelector("#vStar")) v.querySelector("#vStar").onclick = async () => { if (await setStar([w.id], !w.is_star)) { v.querySelector("#vStar").textContent = w.is_star ? "⭐ חשוב" : "☆ חשוב"; STAR_DIRTY = true; } }; } });
}

// עדכון אוטומטי: בכל חזרה לאפליקציה (וכל חצי שעה) בודקים אם יש גרסה חדשה.
// כשיש – מרעננים מיד אם שום דבר לא פתוח; אחרת פס קטן "גרסה חדשה – לרענון".

  const had = !!navigator.serviceWorker.controller; let done = false;
  navigator.serviceWorker.register("sw.js").then(reg => {
    const chk = () => reg.update().catch(() => {});
    document.addEventListener("visibilitychange", () => { if (!document.hidden) chk(); });

  }).catch(() => {});

});
